/* ===== Reference: glossary ===== */
const GLOSS=[
['Branch','A separate line of work. main is the default one.'],['Clone','Download a full copy of a GitHub repo, with its history.'],['Commit','A saved snapshot of your staged changes, with a message and an ID.'],['Commit ID','The code that names a commit, like a1b2c3d.'],
['Conflict','Two changes to the same lines that Git cannot combine by itself.'],['Conventional commit','A message that starts with a type, such as feat:, fix: or chore:.'],['Detached HEAD','Looking at an old commit or tag instead of a branch.'],['Diff','The line-by-line difference between two versions.'],
['Fast-forward','A merge where Git just moves the branch forward, with no merge commit.'],['Fetch','Download new commits from GitHub without merging them.'],['Fork','Your own GitHub copy of someone else\'s repo.'],['.gitignore','A file listing what Git must never track.'],
['GitHub Pages','Free hosting for static websites, straight from a repo.'],['HEAD','The commit you are on right now.'],['HEAD~1','The commit before HEAD. HEAD~2 is two before.'],['Issue','A to-do item, bug or idea on GitHub.'],
['Main','The default branch, the version that should always work.'],['Merge','Combine one branch\'s commits into another.'],['Origin','The usual nickname for your GitHub copy of the repo.'],['Pull','Download and merge new commits from GitHub.'],
['Pull request (PR)','A GitHub page proposing to merge a branch, showing every change.'],['Push','Upload your commits to GitHub.'],['Rebase','Replay commits on top of another branch. Skip it until you are comfortable.'],['Reflog','Git\'s diary of everywhere HEAD has been. Used to find lost commits.'],
['Release','A tag with notes, shown on GitHub.'],['Remote','A copy of the repo somewhere else, usually GitHub.'],['Repository (repo)','A project folder whose history Git tracks.'],['Squash merge','Merging a branch as one single commit.'],
['Staging area','The changes that will go into the next commit.'],['Stash','A temporary shelf for unfinished changes.'],['Tag','A permanent name for one commit, like v1.0.'],['Untracked file','A file Git has never been told to track.'],
['Upstream','The GitHub branch your local branch pushes to and pulls from.'],['Working tree','The actual files in your project folder right now.'],['Worktree','An extra folder linked to the same repo, on its own branch.'],['Branch protection','GitHub settings that stop force pushes or direct pushes to main.'],['Git LFS','An add-on for storing large files outside normal Git.']].sort((a,b)=>a[0].replace(/^\./,'').localeCompare(b[0].replace(/^\./,'')));

function refPage(kind){let title,lead,body;
  if(kind==='errors'){title='Common errors';lead='Copy the first line of your error and search for it here. Each card says what it means and how to fix it.';
    body=`<input class="rfilter" id="rf" type="search" placeholder="Search errors, e.g. rejected, upstream, 404" aria-label="Search errors"><div class="errs" id="rl">${ERRORS.map(([e,m,f])=>`<article class="err" data-k="${esc((e+' '+m+' '+f).toLowerCase())}"><code>${esc(e)}</code><p><b>What it means:</b> ${esc(m)}</p><p class="fix"><b>Fix:</b> ${esc(f)}</p></article>`).join('')}</div><p class="empty" id="rnone" hidden>No match. Try one word from the error, or paste it into your AI tool with "explain this Git error".</p>`;}
  else if(kind==='glossary'){title='Glossary';lead='Every Git and GitHub word in this book, in plain English.';
    body=`<input class="rfilter" id="rf" type="search" placeholder="Search a word" aria-label="Search the glossary"><dl class="gloss" id="rl">${GLOSS.map(([t,d])=>`<div data-k="${esc((t+' '+d).toLowerCase())}"><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join('')}</dl><p class="empty" id="rnone" hidden>No match.</p>`;}
  else{title='VS Code and Cursor buttons';lead='Prefer clicking? Every command in this book has a button in the Source Control panel of VS Code and Cursor. Learn the command, then use whichever is faster.';
    body=`<div class="tbl" style="max-width:60rem"><table><thead><tr><th>Task</th><th>Command</th><th>In VS Code / Cursor</th></tr></thead><tbody>${GUI.map(([t,c,g])=>`<tr><th>${esc(t)}</th><td><code>${esc(c)}</code></td><td>${esc(g)}</td></tr>`).join('')}</tbody></table></div>
    <div class="note"><b>Tip:</b> the Source Control panel shows the same states as <code>git status</code>: <b>U</b> untracked, <b>M</b> modified, <b>A</b> added (staged), <b>D</b> deleted, <b>C</b> conflict.</div>
    <p class="lead" style="font-size:1rem">GitHub Desktop is a free standalone app with the same buttons, if you don't use VS Code or Cursor.</p>`;}
  $('#main').innerHTML=`<div class="read"><p class="eyebrow">Reference</p><h1>${title}</h1><p class="lead">${lead}</p></div>${body}${footer()}`;
  labelTables();const f=$('#rf');if(f)f.oninput=()=>{const q=f.value.trim().toLowerCase();let n=0;document.querySelectorAll('#rl [data-k]').forEach(el=>{const ok=!q||el.dataset.k.includes(q);el.hidden=!ok;if(ok)n++;});$('#rnone').hidden=n>0;};}

/* ===== State & storage ===== */
const LS='gitvibe-book-v1';

try{const raw=localStorage.getItem(LS);if(raw)P=Object.assign(P,JSON.parse(raw));}catch(e){}
P.c=P.c||{};if(!P.os)P.os=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent||'')?'mac':'win';
function saveP(){try{localStorage.setItem(LS,JSON.stringify(P));}catch(e){}}
const SIM={};
function sim(ch){if(!SIM[ch.id]){SIM[ch.id]={S:ch.lab.setup(),lines:[],hist:[],hi:0,tab:'files'};const w=SIM[ch.id].lines;w.push([ch.id==='sandbox'?'Sandbox ready. Type help to see every command.':`Lab ready: ${ch.title}`,'info']);w.push(['Type a command and press Enter. Click any command in the lesson or a hint to paste it here.','dim']);}return SIM[ch.id];}
const $=s=>document.querySelector(s);
const TOTAL=CH.reduce((n,c)=>n+c.lab.missions.length,0);
function doneCount(id){return (P.m[id]||[]).length;}
const SETUP=CH.find(c=>c.setup);
function ckKey(ch){return Array.isArray(ch.checklist)?ch.id:P.os;}
function ckList(ch){return Array.isArray(ch.checklist)?ch.checklist:ch.checklist[P.os];}
function checkDone(ch){ch=ch||SETUP;const l=ckList(ch),s=P.c[ckKey(ch)]||[];return [s.filter(i=>i<l.length).length,l.length];}

function fileState(S,f){if(!S.repo)return ['no Git yet',''];const r=S.repo,H=headTree(S),I=r.index,W=S.files;
  if(r.merging&&r.merging.conflicts.includes(f))return ['conflict','conflict'];
  if(I[f]===undefined&&H[f]===undefined)return ignored(S,f)?['ignored','ign']:['untracked','untracked'];
  const staged=I[f]!==H[f],mod=W[f]!==I[f];
  if(W[f]===undefined)return staged?['deleted, staged','staged']:['deleted','del'];
  if(staged&&mod)return ['staged + edited','both'];if(staged)return [H[f]===undefined?'new, staged':'staged','staged'];if(mod)return ['modified','mod'];return ['saved',''];}

  if(sm.tab==='graph'){p.innerHTML=graphHTML(S);return;}
  if(sm.tab==='gh'){p.innerHTML=ghHTML(S);const on=$('#pgon');if(on)on.onclick=()=>{const e=enablePages(S);print(ch,[[e?e:`Settings → Pages saved. Your site is live at ${pagesUrl(S)}`,e?'err':'ok']]);renderPanels(ch);checkMissions(ch);};
    const v=$('#pgview');if(v)v.onclick=()=>{const T=tr(S,S.gh.pages.deployed);S.events.push('pagesVisit');const fr=document.createElement('iframe');fr.className='pgframe';fr.title='Preview of your live site';fr.setAttribute('sandbox','');fr.srcdoc=T['index.html']===undefined?'<h1 style="font-family:sans-serif">404</h1><p style="font-family:sans-serif">There isn\'t a GitHub Pages site here.</p>':`<style>${T['style.css']||''}</style>${T['index.html']}`;const box=$('#pgframe');box.innerHTML=`<p class="legend">${esc(pagesUrl(S))}</p>`;box.appendChild(fr);checkMissions(ch);};return;}
  if(sm.edit!==undefined&&sm.edit!==null&&S.files[sm.edit]!==undefined){const f=sm.edit;p.innerHTML=`<div class="editor"><div class="edhead"><b>${esc(f)}</b><span>Edit like in your code editor, then Save.</span></div><textarea id="edta" spellcheck="false" aria-label="Contents of ${esc(f)}">${esc(S.files[f])}</textarea><div class="edact"><button class="btn primary" id="edsave" type="button">Save file</button><button class="btn" id="edclose" type="button">Close</button><button class="btn" id="eddel" type="button">Delete file</button></div></div>`;
    $('#edsave').onclick=()=>{S.files[f]=$('#edta').value.replace(/\r/g,'');S.events.push('edit:'+f);print(ch,[[`(saved ${f})`,'dim']]);sm.edit=null;renderPanels(ch);checkMissions(ch);};
    $('#edclose').onclick=()=>{sm.edit=null;renderPanels(ch);};
    $('#eddel').onclick=()=>{delete S.files[f];print(ch,[[`(deleted ${f})`,'dim']]);sm.edit=null;renderPanels(ch);checkMissions(ch);};
    $('#edta').focus();return;}
  sm.edit=null;const tracked=S.repo?union(S.repo.index,headTree(S)):[];const names=[...new Set([...Object.keys(S.files),...tracked])].sort((a,b)=>(a.includes('/')-b.includes('/'))||a.localeCompare(b));
  p.innerHTML=`<ul class="files">${names.map(f=>{const [lab,cls]=fileState(S,f);const gone=S.files[f]===undefined;return `<li tabindex="${gone?-1:0}" data-f="${esc(f)}" ${gone?'':'role="button"'}><span class="fn ${gone?'gone':''}">${esc(f)}</span><span class="badge ${cls}">${lab}</span></li>`;}).join('')}</ul>
   <form class="newfile" id="nf"><input id="nfname" placeholder="new file name, e.g. about.html" aria-label="New file name"><button class="btn" type="submit">Create</button></form>
   <p class="legend">Click a file to edit it. <b>saved</b> = matches the last commit · <b>modified</b> = changed, not staged · <b>staged</b> = will go in the next commit · <b>untracked</b> = Git has never seen it · <b>ignored</b> = hidden by .gitignore</p>`;
  p.querySelectorAll('.files li').forEach(li=>{const f=li.dataset.f;if(S.files[f]===undefined)return;const o=()=>{sm.edit=f;renderPanels(ch);};li.onclick=o;li.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();o();}};});
  $('#nf').onsubmit=e=>{e.preventDefault();const n=$('#nfname').value.trim();if(!n)return;if(S.files[n]===undefined)S.files[n]='';sm.edit=n;renderPanels(ch);};}
function graphHTML(S){if(!S.repo)return '<p class="empty">No repository yet. Run <code>git init</code> and your commits will appear here.</p>';const r=S.repo;const refs=[];
  if(r.branches[r.head])refs.push([r.head,r.branches[r.head]]);Object.keys(r.branches).sort().forEach(n=>{if(n!==r.head)refs.push([n,r.branches[n]]);});Object.keys(r.known).forEach(n=>refs.push(['origin/'+n,r.known[n]]));if(r.detached)refs.unshift(['HEAD',r.detached]);
  const all=new Set();refs.forEach(([,id])=>ancestors(S,id).forEach(x=>all.add(x)));if(!all.size)return '<p class="empty">No commits yet. Your first <code>git commit</code> will appear here.</p>';
  const list=[...all].sort((a,b)=>S.objs[b].seq-S.objs[a].seq).slice(0,16);const shown=new Set(list);const lane={};let ln=0;
  refs.forEach(([,id])=>{let x=id,used=false;while(x&&shown.has(x)&&lane[x]===undefined){lane[x]=ln;used=true;x=S.objs[x].parents[0];}if(used)ln++;});list.forEach(id=>{if(lane[id]===undefined)lane[id]=ln++;});
  const RH=32,LW=18,pad=12,w=pad*2+Math.max(0,ln-1)*LW,h=list.length*RH;const pos={};list.forEach((id,i)=>pos[id]=[pad+lane[id]*LW,i*RH+RH/2]);const hid=headId(S);
  let svg=`<svg class="g-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">`;
  list.forEach(id=>{const [x,y]=pos[id];S.objs[id].parents.forEach(pp=>{if(pos[pp]){const [px,py]=pos[pp];const cl=lane[px>x?id:pp]%4;svg+=px===x?`<line x1="${x}" y1="${y}" x2="${px}" y2="${py}" class="g-edge l${lane[id]%4}"/>`:`<path d="M${x} ${y} C ${x} ${y+RH*.7}, ${px} ${py-RH*.7}, ${px} ${py}" class="g-edge l${cl}"/>`;}else svg+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${h}" class="g-edge faded l${lane[id]%4}"/>`;});});
  list.forEach(id=>{const [x,y]=pos[id];svg+=`<circle cx="${x}" cy="${y}" r="${id===hid?6:4.5}" class="g-dot l${lane[id]%4}${id===hid?' head':''}"/>`;});svg+='</svg>';
  const rows=list.map(id=>{const d=decor(S,id).map(t=>`<span class="ref ${t.startsWith('HEAD')?'h':t.startsWith('origin/')?'o':''}">${esc(t)}</span>`).join('');const c=S.objs[id];return `<div class="g-row" style="height:${RH}px"><code class="g-id">${id}</code>${d}<span class="g-msg">${esc(c.msg.split('\n')[0])}</span>${c.author==='teammate'?'<span class="g-who">· teammate</span>':''}</div>`;}).join('');
  return `<div class="graph"><div class="g-lanes" style="width:${w}px">${svg}</div><div class="g-rows">${rows}</div></div><p class="legend">Newest on top. <span class="ref h">HEAD</span> is where you are; <span class="ref o">origin/…</span> is what your computer last saw on GitHub.${all.size>16?' Showing the 16 newest commits.':''}</p>`;}
function ghHTML(S){if(!S.gh)return `<p class="empty">Nothing on GitHub yet. ${S.auth?'Create a repo with <code>gh repo create shop --private --source=. --push</code>.':'Log in first with <code>gh auth login</code>.'}</p>`;const g=S.gh;
  let h=`<div class="ghh"><b>you / ${esc(g.name)}</b><span class="pill">${g.private?'Private':'Public'}</span></div><p class="ghu">${esc(g.url.replace(/\.git$/,''))}</p>`;
  const bs=Object.keys(g.branches).sort((a,b)=>a==='main'?-1:b==='main'?1:a.localeCompare(b));
  h+='<h4>Branches on GitHub</h4>'+(bs.length?'<ul class="ghl">'+bs.map(b=>{const c=S.objs[g.branches[b]];const l=S.repo&&S.repo.branches[b];const st=!l?'<span class="st">not on your computer</span>':l===g.branches[b]?'<span class="st ok">in sync</span>':isAnc(S,g.branches[b],l)?'<span class="st warn">your computer is ahead</span>':isAnc(S,l,g.branches[b])?'<span class="st warn">GitHub is ahead</span>':'<span class="st bad">diverged</span>';return `<li><code>${esc(b)}</code><span class="m">${c.id} ${esc(c.msg.split('\n')[0])}</span>${st}</li>`;}).join('')+'</ul>':'<p class="empty">No branches pushed yet.</p>');
  if(S.issues.length)h+='<h4>Issues</h4><ul class="ghl">'+S.issues.map(i=>`<li><span class="st ${i.open?'ok':''}">${i.open?'Open':'Closed'}</span><span class="m">#${i.n} ${esc(i.title)}</span></li>`).join('')+'</ul>';
  if(S.prs.length)h+='<h4>Pull requests</h4><ul class="ghl">'+S.prs.map(p=>`<li><span class="st ${p.state==='open'?'ok':'merged'}">${p.state==='open'?'Open':'Merged'}</span><span class="m">#${p.n} ${esc(p.title)} <small>${esc(p.branch)} → main</small></span></li>`).join('')+'</ul>';
  const gt=Object.keys(g.tags||{});if(gt.length||S.releases.length)h+='<h4>Tags and releases</h4><ul class="ghl">'+gt.map(t=>{const rl=S.releases.find(x=>x.tag===t);return `<li><code>${esc(t)}</code><span class="m">${rl?esc(rl.notes||rl.title):'tag only'}</span>${rl?'<span class="st ok">Release</span>':''}</li>`;}).join('')+'</ul>';
  h+='<h4>GitHub Pages</h4>';if(!g.pages){h+=g.private?`<p class="empty">Pages needs a <b>public</b> repo on a free account. Make it public with <code>gh repo edit --visibility public --accept-visibility-change-consequences</code></p>`:(g.branches.main?`<p class="empty">Settings → Pages → Deploy from a branch → <b>main</b> → <b>/ (root)</b></p><button class="btn primary" type="button" id="pgon">Turn on GitHub Pages</button>`:'<p class="empty">Push to main first.</p>');}
  else{const T=tr(S,g.pages.deployed);h+=`<p class="empty"><span class="st ok">Live</span> ${esc(pagesUrl(S))} · showing <code>${g.pages.deployed}</code></p><button class="btn" type="button" id="pgview">Preview live site</button>${T['index.html']===undefined?'<p class="empty"><span class="st bad">404</span> No index.html at the top of the repo.</p>':''}<div id="pgframe"></div>`;}
  const secret=Object.values(g.branches).some(id=>[...ancestors(S,id)].some(x=>Object.entries(S.objs[x].tree).some(([f,v])=>/sk_live_[A-Za-z0-9]+/.test(v))));
  h+=`<h4>Secret scan</h4><p class="empty">${secret?'<span class="st bad">Secret found in history</span> Revoke that key.':'<span class="st ok">No secrets found</span>'}</p>`;
  return h;}

/* ===== Quiz ===== */
function renderQuiz(ch){const st=P.q[ch.id]||(P.q[ch.id]={});const el=$('#qz');const answered=Object.keys(st).length;const right=ch.quiz.filter((q,i)=>st[i]===q.a).length;
  el.innerHTML=ch.quiz.map((q,i)=>{const a=st[i];const has=a!==undefined;return `<div class="q"><h3><span>Q${i+1}</span>${esc(q.q)}</h3><div class="opts">${q.o.map((o,j)=>`<button class="opt ${has&&j===q.a?'right':''} ${has&&j===a&&a!==q.a?'wrong':''}" data-q="${i}" data-o="${j}" ${has?'disabled':''} type="button">${esc(o)}</button>`).join('')}</div>${has?`<p class="why"><b>${a===q.a?'Correct.':'Not quite.'}</b> ${esc(q.why)}</p>`:''}</div>`;}).join('')+
   (answered===ch.quiz.length?`<p class="score">${right} of ${ch.quiz.length} correct${right===ch.quiz.length?'. Well done.':'.'}</p><button class="btn" id="qretry" type="button">Try the quiz again</button>`:'');
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st[+b.dataset.q]=+b.dataset.o;saveP();renderQuiz(ch);});
  const rt=$('#qretry');if(rt)rt.onclick=()=>{P.q[ch.id]={};saveP();renderQuiz(ch);};}

route();

</script>
