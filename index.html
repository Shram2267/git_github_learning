function renderCheat(){const rows=[['Setup, once',[['git config --global user.name "Your Name"','Your name on commits'],['git config --global user.email "you@example.com"','Same email as GitHub'],['git config --global init.defaultBranch main','New repos start on main'],['git config --global pull.rebase false','git pull merges'],['gh auth login','Log in to GitHub']]],
 ['Start',[['git init','Make this folder a repo'],['gh repo create my-app --private --source=. --push','Create a GitHub repo and upload'],['git clone <url>','Download an existing repo']]],
 ['Daily loop',[['git pull','Start of the day'],['git status','What changed?'],['git diff','See the changes'],['git add .','Stage everything'],['git commit -m "Add login page"','Save'],['git push','Upload']]],
 ['Undo',[['git restore <file>','Undo one file'],['git restore .','Undo all uncommitted edits'],['git clean -n / git clean -fd','Preview / delete new junk files'],['git reset --soft HEAD~1','Undo last commit, keep work'],['git revert <id>','Undo a pushed commit safely'],['git reset --hard <id>','Go back, lose later work (careful)'],['git reflog','Find "lost" commits'],['git stash / git stash pop','Park / restore work']]],
 ['Branches',[['git branch','List'],['git switch -c <name>','Create and move'],['git switch main','Go back'],['git merge <name>','Merge into current'],['git branch -D <name>','Delete']]],
 ['GitHub',[['git push -u origin <branch>','Upload a branch'],['gh issue create --title "..."','New issue'],['gh pr create --fill','Open a pull request'],['gh pr merge --squash --delete-branch','Merge it'],['git merge --abort','Cancel a bad merge']]]];
  $('#main').innerHTML=`<div class="read"><p class="eyebrow">Reference</p><h1>Cheat sheet</h1><p class="lead">Everything from the book on one page. Pin it or keep it open in a tab.</p></div>
  ${rows.map(([t,r])=>`<h3>${t}</h3><div class="tbl" style="max-width:52rem"><table><tbody>${r.map(([c,d])=>`<tr><td style="width:58%"><code>${esc(c)}</code></td><td>${esc(d)}</td></tr>`).join('')}</tbody></table></div>`).join('')}`;}

/* ===== Chapter ===== */
function renderChapter(ch){if(ch.setup)return renderSetup(ch);const t=ch.lab.missions.length;const idx=CH.indexOf(ch),prev=CH[idx-1],next=CH[idx+1];
  const eyebrow=typeof ch.n==='number'?`Chapter ${ch.n} · ${ch.mins} min read · ${t} missions`:ch.id==='capstone'?`Capstone · about ${ch.mins} minutes · ${t} goals`:'Free play';
  $('#main').innerHTML=`<article>
  <header class="read"><p class="eyebrow">${eyebrow}</p><h1>${esc(ch.title)}</h1><p class="lead">${esc(ch.lead)}</p></header>
  <section class="read lesson">${ch.lesson}</section>
  <section class="lab" id="lab" aria-labelledby="labh"><div class="lab-head"><h2 id="labh">${ch.id==='sandbox'?'Playground':'Practice lab'}</h2><p>${ch.lab.intro}</p></div>
   <div class="labgrid" ${t?'':'style="grid-template-columns:minmax(0,1fr)"'}>
    ${t?`<aside class="missions" aria-label="Missions"><div id="mlist"></div></aside>`:''}
    <div class="bench">
     <div class="term"><div class="tbar"><span class="dots"><i></i><i></i><i></i></span><span class="grow">~/shop · ${esc(ch.title)}</span><button id="tclear" type="button">Clear</button><button id="treset" type="button">Reset lab</button></div>
      <div class="tout" id="tout" role="log" aria-live="polite"></div>
      <div class="chips" id="chips" aria-label="Quick commands"><button type="button" data-c="git status">status</button><button type="button" data-c="git add .">add .</button><button type="button" data-c='git commit -m ""' data-k="1">commit</button><button type="button" data-c="git push">push</button><button type="button" data-c="git pull">pull</button><button type="button" data-c="git log --oneline">log</button><button type="button" data-c="git diff --stat">diff</button><button type="button" data-c="test">test</button><button type="button" data-up="1">↑ last</button></div><form class="tin" id="tform" autocomplete="off"><label for="tin" id="ps"></label><input id="tin" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="type a command, e.g. git status"></form></div>
     <div class="panels"><div class="tabs" role="tablist"><button role="tab" data-tab="files" id="tb-files">Files</button><button role="tab" data-tab="graph" id="tb-graph">History</button><button role="tab" data-tab="gh" id="tb-gh">GitHub</button></div><div class="pane" id="pane" role="tabpanel"></div></div>
    </div></div></section>
  ${ch.quiz.length?`<section class="quiz" aria-labelledby="qh"><h2 id="qh">Check yourself</h2><p>Pick an answer to see if you are right and why.</p><div id="qz"></div></section>`:''}
  <nav class="pager">${prev?`<a href="#${prev.id}"><small>Previous</small>${esc(prev.title)}</a>`:'<span></span>'}${next?`<a class="nx" href="#${next.id}"><small>Next</small>${esc(next.title)}</a>`:`<a class="nx" href="#cheatsheet"><small>Next</small>Cheat sheet</a>`}</nav></article>`;
  enhanceLesson();mountLab(ch);if(ch.quiz.length)renderQuiz(ch);}

const CMDRE=/^(git|gh|echo|ai|test|ls|cat|nano|github|touch|rm)\b/;
function labelTables(){document.querySelectorAll('.tbl table').forEach(t=>{const hs=[...t.querySelectorAll('thead th')].map(h=>h.textContent.trim());t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((c,i)=>{if(c.tagName==='TD'&&hs[i]!==undefined)c.dataset.label=hs[i];}));});}
function enhanceLesson(){labelTables();document.querySelectorAll('.lesson code').forEach(c=>{if(c.closest('pre'))return;const t=c.textContent.trim();if(CMDRE.test(t)&&!/[<…]/.test(t)){c.classList.add('run');c.title='Click to paste into the lab';c.tabIndex=0;}});
  document.querySelectorAll('.lesson pre').forEach(pre=>{const lines=pre.textContent.replace(/\n$/,'').split('\n');pre.innerHTML=lines.map(l=>{const m=l.match(/^(.*?)(\s+#\s.*)?$/);const cmd=(m[1]||'').trim();const isCmd=CMDRE.test(cmd)&&!/<[a-z-]+>|…/.test(cmd);return `<span class="ln${isCmd?' run':''}"${isCmd?` data-cmd="${esc(cmd)}" tabindex="0" title="Click to paste into the lab"`:''}>${esc(m[1]||'')}${m[2]?`<span class="cm">${esc(m[2])}</span>`:''}</span>`;}).join('');});
  const go=el=>{const v=el.dataset.cmd||el.textContent.trim();paste(v);};
  document.querySelectorAll('.lesson .run').forEach(el=>{el.addEventListener('click',()=>go(el));el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go(el);}});});}
function paste(v){const i=$('#tin');if(!i)return;i.value=v;$('#lab').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});setTimeout(()=>{i.focus();i.setSelectionRange(v.length,v.length);},250);}

function renderSetup(ch){const idx=CH.indexOf(ch),next=CH[idx+1];
  $('#main').innerHTML=`<article><header class="read"><p class="eyebrow">Chapter 0 · about ${ch.mins} minutes · do this once</p><h1>${esc(ch.title)}</h1><p class="lead">${esc(ch.lead)}</p></header>
  <section class="read lesson">${ch.lesson}</section>
  <section class="lab" aria-labelledby="ckh"><div class="lab-head"><h2 id="ckh">Your setup checklist</h2><p>Tick each step as you finish it on your own computer. Your ticks are saved in this browser.</p></div><div class="checks" id="checks"></div></section>
  <section class="quiz" aria-labelledby="qh"><h2 id="qh">Check yourself</h2><p>Pick an answer to see if you are right and why.</p><div id="qz"></div></section>
  <nav class="pager"><span></span><a class="nx" href="#${next.id}"><small>Next</small>${esc(next.title)}</a></nav></article>`;
  document.querySelectorAll('.lesson pre').forEach(pre=>{const txt=pre.textContent.replace(/\n$/,'');const w=document.createElement('div');w.className='prewrap';pre.parentNode.insertBefore(w,pre);w.appendChild(pre);const b=document.createElement('button');b.type='button';b.className='copy';b.textContent='Copy';w.appendChild(b);
    b.onclick=()=>{const done=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1500);};const sel=()=>{const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected: press Ctrl+C';setTimeout(()=>b.textContent='Copy',2500);};try{navigator.clipboard.writeText(txt).then(done,sel);}catch(e){sel();}};});
  labelTables();applyOS(ch);renderQuiz(ch);}
function applyOS(ch){document.querySelectorAll('.osbar button').forEach(b=>{b.setAttribute('aria-selected',b.dataset.os===P.os);b.onclick=()=>{P.os=b.dataset.os;saveP();applyOS(ch);renderRail(ch.id);};});
  document.querySelectorAll('.lesson [data-os]').forEach(el=>{if(el.tagName==='BUTTON')return;el.hidden=el.dataset.os!==P.os;});
  const list=ch.checklist[P.os],s=P.c[P.os]||(P.c[P.os]=[]);const [d,t]=checkDone();
  $('#checks').innerHTML=`<div class="mhead"><b>${P.os==='mac'?'Mac':'Windows'} setup</b><span>${d} of ${t} done</span></div><div class="bar"><i style="width:${d/t*100}%"></i></div><ul class="cklist">${list.map((x,i)=>`<li><label><input type="checkbox" id="ck-${P.os}-${i}" ${s.includes(i)?'checked':''}><span>${esc(x)}</span></label></li>`).join('')}</ul>${d===t?'<div class="labdone">Your computer is ready. Start Chapter 1.</div>':''}`;
  list.forEach((x,i)=>{$('#ck-'+P.os+'-'+i).onchange=e=>{const arr=P.c[P.os];const k=arr.indexOf(i);if(e.target.checked&&k<0)arr.push(i);if(!e.target.checked&&k>=0)arr.splice(k,1);saveP();applyOS(ch);renderRail(ch.id);};});}

/* ===== Lab ===== */
let CUR=null;
function mountLab(ch){CUR=ch;const sm=sim(ch);const out=$('#tout');out.innerHTML=sm.lines.map(lineHTML).join('');out.scrollTop=out.scrollHeight;
  renderMissions(ch);renderPanels(ch);setPrompt(ch);
  $('#tform').onsubmit=e=>{e.preventDefault();const i=$('#tin');const v=i.value;if(!v.trim())return;i.value='';sm.hist.push(v);sm.hi=sm.hist.length;exec1(ch,v);};
  $('#tin').onkeydown=e=>{if(e.key==='ArrowUp'){if(sm.hi>0){sm.hi--;e.target.value=sm.hist[sm.hi];e.preventDefault();}}else if(e.key==='ArrowDown'){if(sm.hi<sm.hist.length-1){sm.hi++;e.target.value=sm.hist[sm.hi];}else{sm.hi=sm.hist.length;e.target.value='';}e.preventDefault();}else if(e.key==='l'&&e.ctrlKey){e.preventDefault();sm.lines=[];out.innerHTML='';}};
  document.querySelectorAll('#chips button').forEach(c=>c.onclick=()=>{const i=$('#tin');if(c.dataset.up){if(sm.hist.length){sm.hi=Math.max(0,sm.hi-1);i.value=sm.hist[sm.hi]||'';}}else{i.value=c.dataset.c;}i.focus();const p=c.dataset.k?i.value.length-1:i.value.length;i.setSelectionRange(p,p);});
  $('#tclear').onclick=()=>{sm.lines=[];out.innerHTML='';$('#tin').focus();};
  $('#treset').onclick=()=>{delete SIM[ch.id];mountLab(ch);print(ch,[['Lab reset to its starting state. Your ticked missions are kept.','dim']]);};
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{sm.tab=b.dataset.tab;renderPanels(ch);});}
function lineHTML([t,c]){if(c==='__clear')return '';const html=c&&c.split(' ').includes('html');const cls=(c||'').split(' ').filter(x=>x!=='html').join(' ');return `<div class="l ${cls}">${html?t:esc(t)}</div>`;}
function print(ch,arr){const sm=sim(ch),out=$('#tout');let html='';for(const l of arr){if(l[1]==='__clear'){sm.lines=[];out.innerHTML='';html='';continue;}sm.lines.push(l);html+=lineHTML(l);}if(sm.lines.length>800)sm.lines.splice(0,sm.lines.length-800);if(out){out.insertAdjacentHTML('beforeend',html);out.scrollTop=out.scrollHeight;}}
function exec1(ch,v){const sm=sim(ch),S=sm.S;print(ch,[[`<span class="ps">${esc(promptText(S))}</span> ${esc(v)}`,'cmd html']]);const res=run(S,v);print(ch,res);
  if(S.openFile){sm.tab='files';sm.edit=S.openFile;S.openFile=null;}
  renderPanels(ch);setPrompt(ch);checkMissions(ch);}
function promptText(S){const r=S.repo;let b='';if(r){b=r.detached?`(${r.detached})`:`(${r.head}${r.merging?'|MERGING':''})`;}return `you@shop${b?' '+b:''} $`;}
function setPrompt(ch){const S=sim(ch).S,r=S.repo;const b=r?(r.detached?`(${r.detached})`:`(${r.head}${r.merging?'|MERGING':''})`):'';$('#ps').innerHTML=`you@shop ${b?`<b>${esc(b)}</b> `:''}$`;}

function renderMissions(ch){const el=$('#mlist');if(!el)return;const ms=ch.lab.missions,done=P.m[ch.id]||[];const n=done.length;const nextI=ms.findIndex((m,i)=>!done.includes(i));const sm=sim(ch);sm.open=sm.open||{};
  el.parentElement.classList.toggle('all',!!sm.all||nextI<0);
  el.innerHTML=`<div class="mhead"><b>${ch.id==='capstone'?'Goals':'Missions'}</b><span>${n} of ${ms.length} done</span></div><div class="bar"><i style="width:${n/ms.length*100}%"></i></div>
  <ol>${ms.map((m,i)=>{const d=done.includes(i);const open=sm.open[i];return `<li class="mi ${d?'done':''} ${i===nextI?'next':''}"><span class="mk" aria-hidden="true"></span><div><p class="mt">${esc(m.t)}${d?'<span class="sr" style="position:absolute;left:-9999px"> (done)</span>':''}</p>
   <button class="hintbtn" data-i="${i}" aria-expanded="${!!open}">${open?'Hide hint':'Show hint'}</button>
   <div class="hints" ${open?'':'hidden'}>${m.hint.map(h=>`<code data-cmd="${esc(h)}" tabindex="0" title="Click to paste into the terminal">${esc(h)}</code>`).join('')}${m.note?`<small>${esc(m.note)}</small>`:''}</div></div></li>`;}).join('')}</ol>
  <button class="btn mtoggle" type="button" id="mtog">${sm.all?'Show only the next mission':`Show all ${ms.length} missions`}</button>
  ${n===ms.length?`<div class="labdone">${ch.id==='capstone'?'Capstone complete. You ship like a professional now.':'Lab complete. Try the quiz below.'}</div>`:''}`;
  const tg=$('#mtog');if(tg){if(nextI<0)tg.hidden=true;tg.onclick=()=>{sm.all=!sm.all;renderMissions(ch);};}
  el.querySelectorAll('.hintbtn').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sm.open[i]=!sm.open[i];renderMissions(ch);});
  el.querySelectorAll('.hints code').forEach(c=>{const f=()=>{const v=c.dataset.cmd;const i=$('#tin');i.value=v;i.focus();};c.onclick=f;c.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();f();}};});}
function checkMissions(ch){const S=sim(ch).S;const done=P.m[ch.id]||(P.m[ch.id]=[]);const fresh=[];
  ch.lab.missions.forEach((m,i)=>{if(done.includes(i))return;let ok=false;try{ok=!!m.check(S);}catch(e){}if(ok){done.push(i);fresh.push(i);}});
  if(!fresh.length)return;saveP();renderMissions(ch);renderRail(ch.id);
  print(ch,fresh.map(i=>[`✔ Mission ${i+1} done: ${ch.lab.missions[i].t}`,'mission']));
  if(done.length===ch.lab.missions.length)print(ch,[[ch.id==='capstone'?'★ Capstone complete!':'★ Every mission done. The quiz is below.','mission']]);}

/* ===== Panels ===== */
function fileState(S,f){if(!S.repo)return ['no Git yet',''];const r=S.repo,H=headTree(S),I=r.index,W=S.files;
  if(r.merging&&r.merging.conflicts.includes(f))return ['conflict','conflict'];
  if(I[f]===undefined&&H[f]===undefined)return ignored(S,f)?['ignored','ign']:['untracked','untracked'];
  const staged=I[f]!==H[f],mod=W[f]!==I[f];
  if(W[f]===undefined)return staged?['deleted, staged','staged']:['deleted','del'];
  if(staged&&mod)return ['staged + edited','both'];if(staged)return [H[f]===undefined?'new, staged':'staged','staged'];if(mod)return ['modified','mod'];return ['saved',''];}
function renderPanels(ch){const sm=sim(ch),S=sm.S;['files','graph','gh'].forEach(t=>{const b=$('#tb-'+t);if(b)b.setAttribute('aria-selected',sm.tab===t);});const p=$('#pane');if(!p)return;
  if(sm.tab==='graph'){p.innerHTML=graphHTML(S);return;}
  if(sm.tab==='gh'){p.innerHTML=ghHTML(S);return;}
  if(sm.edit!==undefined&&sm.edit!==null&&S.files[sm.edit]!==undefined){const f=sm.edit;p.innerHTML=`<div class="editor"><div class="edhead"><b>${esc(f)}</b><span>Edit like in your code editor, then Save.</span></div><textarea id="edta" spellcheck="false" aria-label="Contents of ${esc(f)}">${esc(S.files[f])}</textarea><div class="edact"><button class="btn primary" id="edsave" type="button">Save file</button><button class="btn" id="edclose" type="button">Close</button><button class="btn" id="eddel" type="button">Delete file</button></div></div>`;
    $('#edsave').onclick=()=>{S.files[f]=$('#edta').value.replace(/\r/g,'');S.events.push('edit:'+f);print(ch,[[`(saved ${f})`,'dim']]);sm.edit=null;renderPanels(ch);checkMissions(ch);};
    $('#edclose').onclick=()=>{sm.edit=null;renderPanels(ch);};
    $('#eddel').onclick=()=>{delete S.files[f];print(ch,[[`(deleted ${f})`,'dim']]);sm.edit=null;renderPanels(ch);checkMissions(ch);};
    $('#edta').focus();return;}
  sm.edit=null;const tracked=S.repo?union(S.repo.index,headTree(S)):[];const names=[...new Set([...Object.keys(S.files),...tracked])].sort((a,b)=>(a.includes('/')-b.includes('/'))||a.localeCompare(b));
  p.innerHTML=`<ul class="files">${names.map(f=>{const [lab,cls]=fileState(S,f);const gone=S.files[f]===undefined;return `<li tabindex="${gone?-1:0}" data-f="${esc(f)}" ${gone?'':'role="button"'}><span class="fn ${gone?'gone':''}">${esc(f)}</span><span class="badge ${cls}">${lab}</span></li>`;}).join('')}</ul>
   <form class="newfile" id="nf"><input id="nfname" placeholder="new file name, e.g. about.html" aria-label="New file name"><button class="btn" type="submit">Create</button></form>
   <p class="legend">Click a file to edit it. <b>saved</b> = matches the last commit · <b>modified</b> = changed, not staged · <b>staged</b> = will go in the next commit · <b>untracked</b> = Git has never seen it · <b>ignored</b> = hidden by .gitignore</p>`;
  p.querySelectorAll('.files li').forEach(li=>{const f=li.dataset.f;if(S.files[f]===undefined)return;const o=()=>{sm.edit=f;renderPanels(ch);};li.onclick=o;li.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();o();}};});
  $('#nf').onsubmit=e=>{e.preventDefault();const n=$('#nfname').value.trim();if(!n)return;if(S.files[n]===undefined)S.files[n]='';sm.edit=n;renderPanels(ch);};}
function graphHTML(S){if(!S.repo)return '<p class="empty">No repository yet. Run <code>git init</code> and your commits will appear here.</p>';const r=S.repo;const refs=[];
  if(r.branches[r.head])refs.push([r.head,r.branches[r.head]]);Object.keys(r.branches).sort().forEach(n=>{if(n!==r.head)refs.push([n,r.branches[n]]);});Object.keys(r.known).forEach(n=>refs.push(['origin/'+n,r.known[n]]));if(r.detached)refs.unshift(['HEAD',r.detached]);
  const all=new Set();refs.forEach(([,id])=>ancestors(S,id).forEach(x=>all.add(x)));if(!all.size)return '<p class="empty">No commits yet. Your first <code>git commit</code> will appear here.</p>';
  const list=[...all].sort((a,b)=>S.objs[b].seq-S.objs[a].seq).slice(0,16);const shown=new Set(list);const lane={};let ln=0;
  refs.forEach(([,id])=>{let x=id,used=false;while(x&&shown.has(x)&&lane[x]===undefined){lane[x]=ln;used=true;x=S.objs[x].parents[0];}if(used)ln++;});list.forEach(id=>{if(lane[id]===undefined)lane[id]=ln++;});
  const RH=32,LW=18,pad=12,w=pad*2+Math.max(0,ln-1)*LW,h=list.length*RH;const pos={};list.forEach((id,i)=>pos[id]=[pad+lane[id]*LW,i*RH+RH/2]);const hid=headId(S);
  let svg=`<svg class="g-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">`;
  list.forEach(id=>{const [x,y]=pos[id];S.objs[id].parents.forEach(pp=>{if(pos[pp]){const [px,py]=pos[pp];const cl=lane[px>x?id:pp]%4;svg+=px===x?`<line x1="${x}" y1="${y}" x2="${px}" y2="${py}" class="g-edge l${lane[id]%4}"/>`:`<path d="M${x} ${y} C ${x} ${y+RH*.7}, ${px} ${py-RH*.7}, ${px} ${py}" class="g-edge l${cl}"/>`;}else svg+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${h}" class="g-edge faded l${lane[id]%4}"/>`;});});
  list.forEach(id=>{const [x,y]=pos[id];svg+=`<circle cx="${x}" cy="${y}" r="${id===hid?6:4.5}" class="g-dot l${lane[id]%4}${id===hid?' head':''}"/>`;});svg+='</svg>';
  const rows=list.map(id=>{const d=decor(S,id).map(t=>`<span class="ref ${t.startsWith('HEAD')?'h':t.startsWith('origin/')?'o':''}">${esc(t)}</span>`).join('');const c=S.objs[id];return `<div class="g-row" style="height:${RH}px"><code class="g-id">${id}</code>${d}<span class="g-msg">${esc(c.msg.split('\n')[0])}</span>${c.author==='teammate'?'<span class="g-who">· teammate</span>':''}</div>`;}).join('');
  return `<div class="graph"><div class="g-lanes" style="width:${w}px">${svg}</div><div class="g-rows">${rows}</div></div><p class="legend">Newest on top. <span class="ref h">HEAD</span> is where you are; <span class="ref o">origin/…</span> is what your computer last saw on GitHub.${all.size>16?' Showing the 16 newest commits.':''}</p>`;}
function ghHTML(S){if(!S.gh)return `<p class="empty">Nothing on GitHub yet. ${S.auth?'Create a repo with <code>gh repo create shop --private --source=. --push</code>.':'Log in first with <code>gh auth login</code>.'}</p>`;const g=S.gh;
  let h=`<div class="ghh"><b>you / ${esc(g.name)}</b><span class="pill">${g.private?'Private':'Public'}</span></div><p class="ghu">${esc(g.url.replace(/\.git$/,''))}</p>`;
  const bs=Object.keys(g.branches).sort((a,b)=>a==='main'?-1:b==='main'?1:a.localeCompare(b));
  h+='<h4>Branches on GitHub</h4>'+(bs.length?'<ul class="ghl">'+bs.map(b=>{const c=S.objs[g.branches[b]];const l=S.repo&&S.repo.branches[b];const st=!l?'<span class="st">not on your computer</span>':l===g.branches[b]?'<span class="st ok">in sync</span>':isAnc(S,g.branches[b],l)?'<span class="st warn">your computer is ahead</span>':isAnc(S,l,g.branches[b])?'<span class="st warn">GitHub is ahead</span>':'<span class="st bad">diverged</span>';return `<li><code>${esc(b)}</code><span class="m">${c.id} ${esc(c.msg.split('\n')[0])}</span>${st}</li>`;}).join('')+'</ul>':'<p class="empty">No branches pushed yet.</p>');
  if(S.issues.length)h+='<h4>Issues</h4><ul class="ghl">'+S.issues.map(i=>`<li><span class="st ${i.open?'ok':''}">${i.open?'Open':'Closed'}</span><span class="m">#${i.n} ${esc(i.title)}</span></li>`).join('')+'</ul>';
  if(S.prs.length)h+='<h4>Pull requests</h4><ul class="ghl">'+S.prs.map(p=>`<li><span class="st ${p.state==='open'?'ok':'merged'}">${p.state==='open'?'Open':'Merged'}</span><span class="m">#${p.n} ${esc(p.title)} <small>${esc(p.branch)} → main</small></span></li>`).join('')+'</ul>';
  const secret=Object.values(g.branches).some(id=>[...ancestors(S,id)].some(x=>Object.entries(S.objs[x].tree).some(([f,v])=>/sk_live_[A-Za-z0-9]+/.test(v))));
  h+=`<h4>Secret scan</h4><p class="empty">${secret?'<span class="st bad">Secret found in history</span> Revoke that key.':'<span class="st ok">No secrets found</span>'}</p>`;
  return h;}

/* ===== Quiz ===== */
function renderQuiz(ch){const st=P.q[ch.id]||(P.q[ch.id]={});const el=$('#qz');const answered=Object.keys(st).length;const right=ch.quiz.filter((q,i)=>st[i]===q.a).length;
  el.innerHTML=ch.quiz.map((q,i)=>{const a=st[i];const has=a!==undefined;return `<div class="q"><h3><span>Q${i+1}</span>${esc(q.q)}</h3><div class="opts">${q.o.map((o,j)=>`<button class="opt ${has&&j===q.a?'right':''} ${has&&j===a&&a!==q.a?'wrong':''}" data-q="${i}" data-o="${j}" ${has?'disabled':''} type="button">${esc(o)}</button>`).join('')}</div>${has?`<p class="why"><b>${a===q.a?'Correct.':'Not quite.'}</b> ${esc(q.why)}</p>`:''}</div>`;}).join('')+
   (answered===ch.quiz.length?`<p class="score">${right} of ${ch.quiz.length} correct${right===ch.quiz.length?'. Well done.':'.'}</p><button class="btn" id="qretry" type="button">Try the quiz again</button>`:'');
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st[+b.dataset.q]=+b.dataset.o;saveP();renderQuiz(ch);});
  const rt=$('#qretry');if(rt)rt.onclick=()=>{P.q[ch.id]={};saveP();renderQuiz(ch);};}

route();

</script>
