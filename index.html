<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An interactive book that teaches Git and GitHub to people who build with AI, with a live practice terminal in every chapter.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Git for Vibe Coders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: chapter rail on the left, reading column, then a full-width lab bench (missions + terminal + panels) */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e5e9ee; --ink:#18212d; --muted:#566271; --line:#d3d9e0;
  --accent:#d4481e; --accent-ink:#b03a14; --accent-soft:#fbe5db;
  --good:#1c7c50; --good-soft:#dbf0e4; --bad:#b4352c; --bad-soft:#f7e0dc; --warn:#8f6400; --warn-soft:#f5ebcc; --blue:#2c5fb8;
  --term:#121a25; --term-2:#1b2532; --term-fg:#d5dde8; --t-g:#7ad6a0; --t-r:#ff8a80; --t-y:#e9c46a; --t-b:#8ab8ff; --t-dim:#8590a1; --t-deco:#f4a37f; --t-p:#c9a0ff;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#151c25; --sunk:#1c2531; --ink:#e6ebf1; --muted:#99a5b4; --line:#2a3544;
  --accent:#ff7448; --accent-ink:#ff9670; --accent-soft:#3a2219;
  --good:#4cc68a; --good-soft:#16301f; --bad:#ff7a70; --bad-soft:#3a1d1b; --warn:#e5b54a; --warn-soft:#33290f; --blue:#8ab8ff;
  --term:#0a0f15; --term-2:#131b25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c25; --sunk:#1c2531; --ink:#e6ebf1; --muted:#99a5b4; --line:#2a3544;
  --accent:#ff7448; --accent-ink:#ff9670; --accent-soft:#3a2219;
  --good:#4cc68a; --good-soft:#16301f; --bad:#ff7a70; --bad-soft:#3a1d1b; --warn:#e5b54a; --warn-soft:#33290f; --blue:#8ab8ff;
  --term:#0a0f15; --term-2:#131b25; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:16px/1.62 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink)}
code,kbd,pre{font-family:var(--f-mono);font-size:.86em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding-block:10px;padding-inline:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.mark{width:28px;height:28px;flex:none}
.brand b{font:800 1.06rem/1 var(--f-display);font-stretch:85%;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1}
.prog{display:flex;align-items:center;gap:10px;white-space:nowrap;flex:none;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{width:120px}
.navbtn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:.88rem}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

/* shell */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:calc(100vh - 54px)}
.rail{border-right:1px solid var(--line);background:var(--surface);padding-block:18px;padding-inline:12px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
.rail h6{font:600 .7rem/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 10px 8px}
.rail h6:first-child{margin-top:4px}
.rail a{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.92rem;line-height:1.3}
.rail a:hover{background:var(--sunk)}
.rail a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.rail .n{font:600 .74rem/1 var(--f-mono);color:var(--muted);text-align:center}
.rail a.on .n{color:var(--accent-ink)}
.rail .c{font:500 .72rem/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.rail .c.full{color:var(--good)}
.rail .reset{margin:22px 10px 6px;font-size:.8rem;color:var(--muted);background:none;border:0;padding:0;text-decoration:underline}
main{min-width:0;padding-block:36px 80px;padding-inline:clamp(16px,4vw,48px)}

/* reading */
.read{max-width:44rem}
.eyebrow{font:600 .74rem/1.2 var(--f-body);letter-spacing:.13em;text-transform:uppercase;color:var(--accent-ink);margin:0 0 10px}
h1{font:800 clamp(2.1rem,4.6vw,3.2rem)/1.02 var(--f-display);font-stretch:82%;letter-spacing:-.01em;margin:0 0 14px;text-wrap:balance}
h2{font:800 clamp(1.5rem,2.6vw,1.9rem)/1.1 var(--f-display);font-stretch:85%;margin:0 0 8px;text-wrap:balance}
h3{font:700 1.14rem/1.3 var(--f-display);margin:2em 0 .5em}
.lead{font-size:1.14rem;color:var(--muted);margin:0 0 8px;max-width:38rem}
.lesson p,.lesson li{max-width:65ch}
.lesson ul,.lesson ol{padding-left:1.25em}
.lesson li{margin:.25em 0}
.lesson :not(pre)>code{background:var(--sunk);padding:.12em .4em;border-radius:5px}
code.run,.ln.run{cursor:pointer}
code.run:hover{background:var(--accent-soft)!important;color:var(--accent-ink)}
pre{background:var(--term);color:var(--term-fg);border-radius:var(--r);padding:14px 16px;overflow-x:auto;line-height:1.55;margin:1em 0}
pre .ln{display:block;border-radius:4px;padding-inline:4px;margin-inline:-4px}
pre .ln.run:hover{background:var(--term-2)}
pre .ln.run::after{content:"  ↵ try";color:var(--t-dim);font-size:.85em;opacity:0}
pre .ln.run:hover::after{opacity:1}
pre .cm{color:var(--t-dim)}
.tbl{overflow-x:auto;margin:1em 0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child>*{border-bottom:0}
thead th{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
tbody th{font-weight:600}
.note{border-left:3px solid var(--accent);background:var(--surface);padding:12px 16px;border-radius:0 var(--r) var(--r) 0;margin:1.2em 0;max-width:65ch}
.note.warn{border-color:var(--bad)}
.note b{color:var(--ink)}

/* flow diagram */
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;align-items:stretch;gap:6px;margin:1.2em 0;max-width:52rem}
.fbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fbox b{font:700 .95rem/1.2 var(--f-display)}
.fbox span{font-size:.8rem;color:var(--muted);line-height:1.35}
.fbox.hot{border-color:var(--accent);background:var(--accent-soft)}
.farrow{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;color:var(--muted);padding-inline:2px}
.farrow::after{content:"→";font-size:1.2rem;line-height:1;color:var(--accent)}
.farrow code{font-size:.7rem;white-space:nowrap}
.loop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:1.2em 0;font-size:.9rem}
.loop span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.loop span.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.loop i{font-style:normal;color:var(--accent)}

/* lab */
.lab{margin-top:56px;border-top:2px solid var(--ink);padding-top:22px}
.lab-head{max-width:44rem;margin-bottom:18px}
.lab-head p{color:var(--muted);margin:0}
.labgrid{display:grid;grid-template-columns:minmax(250px,320px) minmax(0,1fr);gap:18px;align-items:start}
.missions{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
.mhead{display:flex;justify-content:space-between;align-items:baseline;font-size:.84rem;color:var(--muted);margin-bottom:8px;font-variant-numeric:tabular-nums}
.mhead b{font:700 1rem/1 var(--f-display);color:var(--ink)}
.missions ol{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;counter-reset:m}
.mi{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:9px 8px;border-radius:8px;counter-increment:m}
.mi.next{background:var(--sunk)}
.mk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 .7rem/1 var(--f-mono);color:var(--muted);margin-top:1px}
.mk::before{content:counter(m)}
.mi.done .mk{background:var(--good);border-color:var(--good);color:var(--surface)}
.mi.done .mk::before{content:"✓";font-size:.8rem}
.mi.done .mt{color:var(--muted)}
.mt{font-size:.9rem;line-height:1.4;margin:0}
.hintbtn{background:none;border:0;padding:0;margin-top:4px;font-size:.78rem;color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px}
.hints{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.hints code{display:block;background:var(--term);color:var(--term-fg);padding:6px 8px;border-radius:6px;font-size:.76rem;white-space:pre-wrap;word-break:break-word;cursor:pointer}
.hints code:hover{outline:1px solid var(--accent)}
.hints small{font-size:.78rem;color:var(--muted);line-height:1.4}
.labdone{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--good-soft);color:var(--good);font-size:.86rem;font-weight:600}
.labtools{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:.84rem;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}

.bench{display:flex;flex-direction:column;gap:14px;min-width:0}
.term{background:var(--term);border-radius:var(--r);overflow:hidden;color:var(--term-fg);box-shadow:0 1px 0 rgba(0,0,0,.04),0 10px 30px -18px rgba(10,20,40,.5)}
.tbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--term-2);font:500 .76rem/1 var(--f-mono);color:var(--t-dim)}
.tbar .dots{display:flex;gap:6px}
.tbar .dots i{width:10px;height:10px;border-radius:50%;background:#3a4656}
.tbar .grow{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tbar button{background:none;border:1px solid #344152;color:var(--t-dim);border-radius:6px;padding:4px 8px;font:inherit}
.tbar button:hover{color:var(--term-fg)}
.tout{height:380px;overflow:auto;padding:12px 14px 4px;font:13px/1.55 var(--f-mono);white-space:pre-wrap;word-break:break-word;tab-size:4}
.tout .l{min-height:1.55em}
.l.ok,.t-g{color:var(--t-g)} .l.err,.t-r{color:var(--t-r)} .l.warn,.t-y{color:var(--t-y)} .l.dim,.t-dim{color:var(--t-dim)} .l.info{color:var(--t-b)} .l.b{font-weight:600;color:#eef3f9} .t-deco{color:var(--t-deco)} .t-p{color:var(--t-p)}
.l.cmd{color:#fff;margin-top:6px}
.l.cmd .ps{color:var(--t-g)}
.l.mission{color:var(--t-y);font-weight:600;border:1px dashed #5a4a20;border-radius:6px;padding:4px 8px;margin:6px 0;display:inline-block}
.tin{display:flex;align-items:center;gap:8px;padding:10px 14px 12px;border-top:1px solid #222d3a;font:13px/1.4 var(--f-mono)}
.tin label{color:var(--t-g);white-space:nowrap;flex:none}
.tin label b{color:var(--t-b);font-weight:400}
.tin input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:inherit;outline:none;caret-color:var(--t-g)}
.tin input::placeholder{color:#55606f}

.panels{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--sunk);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 16px;font-size:.86rem;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);background:var(--surface);font-weight:600}
.pane{padding:14px 16px;min-height:150px}
.empty{color:var(--muted);font-size:.9rem;margin:0}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.files li{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;cursor:pointer}
.files li:hover{background:var(--sunk)}
.files .fn{font:500 .86rem/1.3 var(--f-mono);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .fn.gone{text-decoration:line-through;color:var(--muted)}
.badge{font:600 .68rem/1 var(--f-body);letter-spacing:.04em;padding:4px 7px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.badge.mod,.badge.untracked,.badge.del{background:var(--bad-soft);color:var(--bad)}
.badge.staged,.badge.new{background:var(--good-soft);color:var(--good)}
.badge.both{background:var(--warn-soft);color:var(--warn)}
.badge.conflict{background:var(--warn);color:var(--surface)}
.badge.ign{background:transparent;border:1px dashed var(--line)}
.legend{font-size:.76rem;color:var(--muted);margin:10px 0 0}
.newfile{display:flex;gap:8px;margin-top:10px}
.newfile input,.editor textarea{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 10px;font:13px/1.5 var(--f-mono)}
.newfile input{flex:1;min-width:0}
.editor{display:flex;flex-direction:column;gap:8px}
.edhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.edhead b{font:600 .9rem/1.2 var(--f-mono)}
.edhead span{font-size:.78rem;color:var(--muted)}
.editor textarea{min-height:190px;resize:vertical;width:100%}
.edact{display:flex;gap:8px;flex-wrap:wrap}

.graph{display:flex;align-items:flex-start;overflow-x:auto}
.g-lanes{flex:none}
.g-svg{display:block}
.g-edge{fill:none;stroke-width:2}
.g-edge.faded{opacity:.35;stroke-dasharray:3 3}
.g-dot{stroke:var(--surface);stroke-width:2}
.l0{stroke:var(--accent);fill:var(--accent)} .l1{stroke:var(--blue);fill:var(--blue)} .l2{stroke:var(--good);fill:var(--good)} .l3{stroke:var(--warn);fill:var(--warn)}
.g-edge.l0,.g-edge.l1,.g-edge.l2,.g-edge.l3{fill:none}
.g-dot.head{stroke:var(--ink);stroke-width:2.5}
.g-rows{min-width:0;flex:1}
.g-row{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:.84rem}
.g-id{font-size:.76rem;color:var(--muted)}
.ref{font:600 .68rem/1 var(--f-mono);padding:3px 6px;border-radius:5px;background:var(--sunk);color:var(--ink)}
.ref.h{background:var(--accent);color:#fff}
.ref.o{background:transparent;border:1px solid var(--blue);color:var(--blue)}
.g-msg{overflow:hidden;text-overflow:ellipsis}
.g-who{font-size:.72rem;color:var(--muted)}
.ghh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ghh b{font:700 1rem/1.2 var(--f-mono)}
.pill{font-size:.7rem;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--muted)}
.ghu{font:.78rem/1.4 var(--f-mono);color:var(--muted);margin:4px 0 0;word-break:break-all}
.pane h4{font:600 .72rem/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.ghl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.ghl li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.86rem;flex-wrap:wrap}
.ghl li:last-child{border-bottom:0}
.ghl .m{flex:1;min-width:0}
.ghl small{color:var(--muted)}
.st{font:600 .68rem/1 var(--f-body);padding:4px 7px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.st.ok{background:var(--good-soft);color:var(--good)} .st.warn{background:var(--warn-soft);color:var(--warn)} .st.bad{background:var(--bad-soft);color:var(--bad)} .st.merged{background:#efe6fb;color:#6b3fb0}
:root[data-theme="dark"] .st.merged{background:#2b2140;color:#c9a0ff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st.merged{background:#2b2140;color:#c9a0ff}}

/* quiz */
.quiz{margin-top:56px;max-width:44rem}
.quiz>p{color:var(--muted);margin:0 0 16px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.q h3{margin:0 0 10px;font:600 1rem/1.4 var(--f-body)}
.q h3 span{font:600 .74rem/1 var(--f-mono);color:var(--muted);margin-right:8px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;font-size:.92rem;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{margin:10px 0 0;font-size:.88rem;color:var(--muted)}
.why b{color:var(--ink)}
.score{font:700 1.05rem/1.3 var(--f-display);margin:8px 0 0}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;flex-wrap:wrap;max-width:60rem}
.pager a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 16px;min-width:0;flex:1 1 220px}
.pager a:hover{border-color:var(--accent)}
.pager small{color:var(--muted);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase}
.pager a.nx{text-align:right}

/* home */
.hero{max-width:52rem;padding-bottom:8px}
.hero h1{font-size:clamp(2.6rem,7vw,4.6rem)}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{font-size:1.2rem;max-width:40rem}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 0}
.cta .btn{padding:11px 18px;font-size:.95rem;font-weight:600;text-decoration:none;color:var(--ink)}
.cta .btn.primary{color:#fff}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:40px 0;max-width:60rem}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.how b{display:block;font:700 1rem/1.2 var(--f-display);margin-bottom:4px}
.how p{margin:0;font-size:.9rem;color:var(--muted)}
.how .tag{font:600 .7rem/1 var(--f-mono);color:var(--accent-ink);display:block;margin-bottom:8px}
.demo{max-width:60rem;margin:0 0 40px}
.demo .tout{height:auto;max-height:none}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;max-width:60rem}
.chcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.chcard:hover{border-color:var(--accent)}
.chcard .n{font:600 .74rem/1 var(--f-mono);color:var(--muted)}

<script>
/* ===== Git playground simulator ===== */
let SEQ = 0;
const HEXC = '0123456789abcdef';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function rid(S){let s;do{s='';for(let i=0;i<7;i++)s+=HEXC[Math.floor(Math.random()*16)];}while(S.objs[s]);return s;}
const APP = {
  'index.html':'<h1>My Shop</h1>\n<p>Welcome to my shop!</p>',
  'style.css':'h1 { color: navy; }',
  'app.js':'console.log("shop ready");',
  'README.md':'# My Shop'
};
function newState(files){return {files:Object.assign({},files),config:{},auth:false,repo:null,objs:{},gh:null,issues:[],prs:[],aiCount:0,aiDebug:false,history:[],events:[],openFile:null};}
function base(o){o=o||{};const S=newState(Object.assign({},APP,o.extra||{}));if(o.config!==false){S.config={'user.name':'You','user.email':'you@example.com','init.defaultBranch':'main','pull.rebase':'false'};S.auth=true;}return S;}
function seed(S,cmds){cmds.forEach(c=>run(S,c,true));S.history=[];S.events=[];return S;}

const tr=(S,id)=>id&&S.objs[id]?S.objs[id].tree:{};
function headId(S){const r=S.repo;if(!r)return null;return r.detached||r.branches[r.head]||null;}
function headTree(S){return tr(S,headId(S));}
function ancestors(S,id){const set=new Set(),st=id?[id]:[];while(st.length){const x=st.pop();if(!x||set.has(x)||!S.objs[x])continue;set.add(x);S.objs[x].parents.forEach(p=>st.push(p));}return set;}
function isAnc(S,a,b){if(!a)return true;if(!b)return false;return ancestors(S,b).has(a);}
function mergeBase(S,a,b){const A=ancestors(S,a);let best=null;ancestors(S,b).forEach(x=>{if(A.has(x)&&(!best||S.objs[x].seq>S.objs[best].seq))best=x;});return best;}
function union(...objs){const s=new Set();objs.forEach(o=>Object.keys(o||{}).forEach(k=>s.add(k)));return [...s].sort();}
function commitCount(S){return S.repo?ancestors(S,headId(S)).size:0;}
function msgs(S,id){return [...ancestors(S,id||headId(S))].map(x=>S.objs[x].msg);}
function norm(u){return String(u||'').toLowerCase().replace(/\/+$/,'').replace(/\.git$/,'');}
function remoteOk(S){return !!(S.gh&&S.repo&&S.repo.remote&&norm(S.repo.remote)===norm(S.gh.url));}

function matchPat(p,f){if(p.endsWith('/')){const d=p.slice(0,-1);return f===d||f.startsWith(p)||f.includes('/'+p);}const re=new RegExp('^'+p.split('*').map(x=>x.replace(/[.+?^${}()|[\]\\]/g,'\\$&')).join('[^/]*')+'$');return re.test(f)||re.test(f.split('/').pop());}
function ignored(S,f){const gi=S.files['.gitignore'];if(gi===undefined)return false;let ig=false;gi.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')).forEach(p=>{let neg=false;if(p[0]==='!'){neg=true;p=p.slice(1);}if(matchPat(p,f))ig=!neg;});return ig;}

function status(S){const r=S.repo,H=headTree(S),I=r.index,W=S.files;const conf=r.merging?r.merging.conflicts:[];
  const staged=[],unstaged=[],untracked=[];
  union(H,I).forEach(f=>{if(conf.includes(f))return;if(H[f]!==I[f])staged.push({f,k:H[f]===undefined?'new file':I[f]===undefined?'deleted':'modified'});});
  Object.keys(I).sort().forEach(f=>{if(conf.includes(f))return;if(W[f]!==I[f])unstaged.push({f,k:W[f]===undefined?'deleted':'modified'});});
  Object.keys(W).sort().forEach(f=>{if(I[f]===undefined&&!conf.includes(f)&&!ignored(S,f))untracked.push(f);});
  return {staged,unstaged,untracked,conflicts:conf.slice()};}
function isClean(S){if(!S.repo)return false;const st=status(S);return !st.staged.length&&!st.unstaged.length&&!st.untracked.length&&!st.conflicts.length;}

function makeCommit(S,msg,parents,tree,author){const id=rid(S);S.objs[id]={id,msg,parents:parents.filter(Boolean),tree:Object.assign({},tree),seq:++SEQ,author:author||S.config['user.name']||'you'};return id;}
function moveHead(S,id,action){const r=S.repo;if(r.detached)r.detached=id;else r.branches[r.head]=id;r.reflog.unshift({id,action:String(action).split('\n')[0]});}
function resolve(S,ref){const r=S.repo;if(!ref||!r)return null;let m;
  if(ref==='HEAD'||ref==='@')return headId(S);
  if((m=ref.match(/^HEAD(~(\d*)|\^+)$/))){let n=m[2]!==undefined?(m[2]===''?1:+m[2]):m[1].length;let x=headId(S);while(n-->0&&x)x=S.objs[x].parents[0]||null;return x;}
  if(r.branches[ref])return r.branches[ref];
  if(ref.startsWith('origin/')&&r.known[ref.slice(7)])return r.known[ref.slice(7)];
  if(/^[0-9a-f]{4,}$/.test(ref)){const hit=Object.keys(S.objs).filter(k=>k.startsWith(ref));if(hit.length===1)return hit[0];}
  return null;}
function trackInfo(S){const r=S.repo;if(r.detached||!r.upstream[r.head])return null;const l=r.branches[r.head],k=r.known[r.head];if(!k)return {gone:true};const A=ancestors(S,l),B=ancestors(S,k);let ahead=0,behind=0;A.forEach(x=>{if(!B.has(x))ahead++;});B.forEach(x=>{if(!A.has(x))behind++;});return {ahead,behind};}

function ldiff(a,b){a=a===undefined?[]:a.split('\n');b=b===undefined?[]:b.split('\n');const n=a.length,m=b.length;const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);const ops=[];let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){ops.push([' ',a[i]]);i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])ops.push(['-',a[i++]]);else ops.push(['+',b[j++]]);}while(i<n)ops.push(['-',a[i++]]);while(j<m)ops.push(['+',b[j++]]);return ops;}
function printStat(o,A,B,list){list=list||union(A,B).filter(f=>A[f]!==B[f]);if(!list.length)return;let ti=0,td=0;const w=Math.max(...list.map(f=>f.length));list.forEach(f=>{let i=0,d=0;ldiff(A[f],B[f]).forEach(([t])=>{if(t==='+')i++;if(t==='-')d++;});ti+=i;td+=d;o(`<span> ${esc(f.padEnd(w))} | ${String(i+d).padStart(2)} </span><span class="t-g">${'+'.repeat(Math.min(i,24))}</span><span class="t-r">${'-'.repeat(Math.min(d,24))}</span>`,'html');});o(` ${list.length} file${list.length>1?'s':''} changed, ${ti} insertion${ti===1?'':'s'}(+), ${td} deletion${td===1?'':'s'}(-)`);}

function mergeFile(x,y,z,label){
  if(y===z)return [y,false];if(y===x)return [z,false];if(z===x)return [y,false];
  if(x!==undefined&&y!==undefined&&z!==undefined){const X=x.split('\n'),Y=y.split('\n'),Z=z.split('\n');
    if(X.length===Y.length&&X.length===Z.length){const out=[];let c=false;for(let i=0;i<X.length;i++){if(Y[i]===Z[i])out.push(Y[i]);else if(Y[i]===X[i])out.push(Z[i]);else if(Z[i]===X[i])out.push(Y[i]);else{c=true;out.push('<<<<<<< HEAD',Y[i],'=======',Z[i],'>>>>>>> '+label);}}return [out.join('\n'),c];}}
  if(x!==undefined&&y!==undefined&&z!==undefined){const X=x.split('\n'),Y=y.split('\n'),Z=z.split('\n');let p=0;while(p<X.length&&p<Y.length&&p<Z.length&&X[p]===Y[p]&&Y[p]===Z[p])p++;let s=0;while(s<X.length-p&&s<Y.length-p&&s<Z.length-p&&X[X.length-1-s]===Y[Y.length-1-s]&&Y[Y.length-1-s]===Z[Z.length-1-s])s++;
    const mid=A=>A.slice(p,A.length-s).join('\n');const mx=mid(X),my=mid(Y),mz=mid(Z);const pre=Y.slice(0,p),suf=Y.slice(Y.length-s);let body,c=false;
    if(my===mz||my===mx)body=mz;else if(mz===mx)body=my;else{c=true;body=`<<<<<<< HEAD\n${my}\n=======\n${mz}\n>>>>>>> ${label}`;}
    return [[...pre,...(body===''?[]:[body]),...suf].join('\n'),c];}
  return [`<<<<<<< HEAD\n${y===undefined?'':y}\n=======\n${z===undefined?'':z}\n>>>>>>> ${label}`,true];}
function threeWay(S,h,t,label){const b=mergeBase(S,h,t),B=tr(S,b),O=tr(S,h),Th=tr(S,t),res={},conflicts=[];union(B,O,Th).forEach(f=>{const [v,c]=mergeFile(B[f],O[f],Th[f],label);if(c)conflicts.push(f);if(v!==undefined)res[f]=v;});return {res,conflicts};}
function mergeMsg(S,label){return label.startsWith('origin/')?`Merge branch '${label.slice(7)}' of github.com/you/${S.gh?S.gh.name:'repo'}`:`Merge branch '${label}'`;}
function applyMerge(S,t,label,o){const r=S.repo,h=headId(S);const {res,conflicts}=threeWay(S,h,t,label);const O=tr(S,h);
  union(O,res).forEach(f=>{if(res[f]===undefined){delete S.files[f];delete r.index[f];}else{S.files[f]=res[f];r.index[f]=conflicts.includes(f)?(O[f]!==undefined?O[f]:res[f]):res[f];}});
  conflicts.forEach(f=>o('Auto-merging '+f));
  if(conflicts.length){conflicts.forEach(f=>o('CONFLICT (content): Merge conflict in '+f,'err'));o('Automatic merge failed; fix conflicts and then commit the result.','err');o('Tip: open the file in the Files panel, keep the right lines, delete the marker lines, Save, then git add and git commit.','dim');r.merging={theirs:t,label,conflicts:conflicts.slice(),msg:mergeMsg(S,label)};S.events.push('conflict');return true;}
  const id=makeCommit(S,mergeMsg(S,label),[h,t],r.index);moveHead(S,id,`merge ${label}: Merge made by the 'ort' strategy.`);o("Merge made by the 'ort' strategy.");printStat(o,O,res);S.events.push('merge:'+label);return true;}
function checkoutTree(S,newId){const r=S.repo,H=headTree(S),N=tr(S,newId),I=r.index,W=S.files,bad=[];
  union(H,N).forEach(f=>{if(H[f]===N[f])return;const tracked=H[f]!==undefined||I[f]!==undefined;if(tracked){if(W[f]!==H[f]||I[f]!==H[f])bad.push(f);}else if(W[f]!==undefined&&W[f]!==N[f])bad.push(f);});
  if(bad.length)return bad;
  union(H,N).forEach(f=>{if(H[f]===N[f])return;if(N[f]===undefined){delete W[f];delete I[f];}else{W[f]=N[f];I[f]=N[f];}});return null;}
function overwriteMsg(bad,what){return `error: Your local changes to the following files would be overwritten by ${what||'checkout'}:\n${bad.map(f=>'\t'+f).join('\n')}\nPlease commit your changes or stash them before you ${what==='merge'?'merge':'switch branches'}.\nAborting`;}
function decor(S,id){const r=S.repo,L=[];Object.entries(r.branches).forEach(([n,x])=>{if(x===id){if(!r.detached&&n===r.head)L.unshift('HEAD -> '+n);else L.push(n);}});if(r.detached===id)L.unshift('HEAD');Object.entries(r.known).forEach(([n,x])=>{if(x===id)L.push('origin/'+n);});return L;}

/* ---- tokenizing ---- */
function splitCmds(line){const parts=[];let cur='',q=null;for(let i=0;i<line.length;i++){const c=line[i];if(q){cur+=c;if(c===q&&line[i-1]!=='\\')q=null;continue;}if(c==='"'||c==="'"){q=c;cur+=c;continue;}if(c==='&'&&line[i+1]==='&'){parts.push(cur);cur='';i++;continue;}if(c===';'){parts.push(cur);cur='';continue;}cur+=c;}parts.push(cur);return parts.map(s=>s.trim()).filter(Boolean);}
function tokens(s){const out=[];let cur='',q=null,has=false;for(let i=0;i<s.length;i++){const c=s[i];
  if(q){if(c==='\\'&&s[i+1]===q){cur+=q;i++;continue;}if(c===q){q=null;continue;}cur+=c;continue;}
  if(c==='"'||c==="'"){q=c;has=true;continue;}
  if(c==='#'&&!cur&&!has&&(i===0||/\s/.test(s[i-1])))break;
  if(/\s/.test(c)){if(cur||has){out.push(cur);cur='';has=false;}continue;}
  if(c==='>'){if(cur||has){out.push(cur);cur='';has=false;}if(s[i+1]==='>'){out.push('>>');i++;}else out.push('>');continue;}
  cur+=c;}
  if(cur||has)out.push(cur);return out;}

function run(S,line,silent){const O=[];const o=(t,c)=>O.push([t,c||'']);
  for(const part of splitCmds(line)){let ok;try{ok=exec(S,part,o);}catch(e){o('playground error: '+e.message,'err');ok=false;}if(!silent)S.history.push(part.trim());if(ok===false)break;}
  return O;}

function exec(S,line,o){const a=tokens(line);if(!a.length)return true;const c=a[0],args=a.slice(1);
  switch(c){
    case 'help':return help(o);
    case 'clear':o('','__clear');return true;
    case 'pwd':o('/home/you/shop');return true;
    case 'cd':o('This playground stays inside /home/you/shop.','dim');return true;
    case 'mkdir':o('Folders appear by themselves: save a file named like src/app.js.','dim');return true;
    case 'whoami':o('you');return true;
    case 'ls':{const all=args.some(x=>/^-\w*a/.test(x));const names=[...new Set(Object.keys(S.files).filter(f=>all||!f.startsWith('.')).map(f=>f.includes('/')?f.split('/')[0]+'/':f))].sort();if(all&&S.repo)names.unshift('.git/');if(names.length)o(names.join('   '));return true;}
    case 'cat':{if(!args.length){o('usage: cat <file>','err');return false;}for(const f of args){if(S.files[f]===undefined){const sub=Object.keys(S.files).filter(x=>x.startsWith(f.replace(/\/$/,'')+'/'));if(sub.length)o(`cat: ${f}: Is a directory`,'err');else o(`cat: ${f}: No such file or directory`,'err');return false;}S.files[f].split('\n').forEach(l=>o(l));}return true;}
    case 'echo':{const ri=args.findIndex(x=>x==='>'||x==='>>');const text=(ri<0?args:args.slice(0,ri)).filter(x=>x!=='-e').join(' ').replace(/\\n/g,'\n');if(ri<0){o(text);return true;}const f=args[ri+1];if(!f){o('syntax error: missing file name after >','err');return false;}if(args[ri]==='>')S.files[f]=text;else S.files[f]=(S.files[f]?S.files[f].replace(/\n$/,'')+'\n':'')+text;return true;}
    case 'touch':args.forEach(f=>{if(S.files[f]===undefined)S.files[f]='';});return true;
    case 'rm':{const force=args.some(x=>/^-\w*f/.test(x));for(const f of args.filter(x=>!x.startsWith('-'))){const ks=Object.keys(S.files).filter(x=>x===f||x.startsWith(f.replace(/\/$/,'')+'/'));if(!ks.length){if(!force){o(`rm: cannot remove '${f}': No such file or directory`,'err');return false;}continue;}ks.forEach(k=>delete S.files[k]);}return true;}
    case 'nano':case 'code':case 'edit':case 'vim':case 'vi':{const f=args.find(x=>!x.startsWith('-'));if(!f){o('usage: nano <file>','err');return false;}if(S.files[f]===undefined)S.files[f]='';S.openFile=f;o(`Opened ${f} in the Files panel. Edit it there and press Save.`,'dim');return true;}
    case 'test':return appTest(S,o);
    case 'npm':o('npm is not part of this playground. Use test to check the app.','dim');return true;
    case 'ai':return ai(S,args.join(' '),o);
    case 'git':return git(S,args,o);
    case 'gh':return gh(S,args,o);
    case 'github':return github(S,args,o);
    default:o(`${c}: command not found. Type help to see what this playground understands.`,'err');return false;}}

function help(o){[

  const findPr=()=>{const num=a.find(x=>/^#?\d+$/.test(x));if(num)return S.prs.find(p=>p.n===+num.replace('#',''));return S.prs.find(p=>p.branch===r.head&&p.state==='open')||S.prs.filter(p=>p.state==='open').slice(-1)[0];};
  if(sub==='list'){const op=S.prs.filter(p=>p.state==='open');if(!op.length)o('no open pull requests');op.forEach(p=>o(`#${p.n}  ${p.title}  ${p.branch}`));return true;}
  if(sub==='view'||sub==='diff'){const p=findPr();if(!p){o(`no pull requests found for branch "${r.head}"`,'err');return false;}
    o(`${p.title} #${p.n}`,'b');o(`${p.state==='open'?'Open':'Merged'} • you wants to merge into main from ${p.branch}\n`);if(p.body)o(p.body);
    if(p.state==='open'&&S.gh.branches[p.branch]){o('\nFiles changed','b');const tip=S.gh.branches[p.branch],mb=mergeBase(S,S.gh.branches.main,tip);const A=tr(S,mb),B=tr(S,tip);union(A,B).filter(f=>A[f]!==B[f]).forEach(f=>printDiff(o,f,A[f],B[f]));}
    if(a.includes('--web'))o('(Playground: this is what the Files changed tab shows on github.com. Read every line before you merge.)','dim');S.events.push('prView');return true;}
  if(sub==='merge'){const p=findPr();if(!p||p.state!=='open'){o('X no open pull request found','err');return false;}const tip=S.gh.branches[p.branch],base=S.gh.branches.main;
    if(!tip){o('X the PR branch is not on GitHub any more','err');return false;}
    const mb=mergeBase(S,base,tip),B=tr(S,mb),M=tr(S,base),T=tr(S,tip),res={};let conflict=false;union(B,M,T).forEach(f=>{const [v,c]=mergeFile(B[f],M[f],T[f],'x');if(c)conflict=true;if(v!==undefined)res[f]=v;});
    if(conflict){o(`X Pull request #${p.n} is not mergeable: the merge commit cannot be cleanly created.\nhint: on your branch run git pull origin main, fix the conflict, push, then merge.`,'err');return false;}

    o('GitHub main has the change now, your local main does not yet. Run git pull.','dim');S.events.push('prMerge');return true;}

{id:'setup',n:0,setup:true,title:'Before You Start: Set Up Your Computer',mins:25,blurb:'Everything to install and configure on Windows or Mac before chapter 1.',
lead:'Install five tools and change a few settings once. Pick your computer below and follow the steps in order.',
lesson:`
<div class="osbar" role="tablist" aria-label="Choose your computer"><button role="tab" data-os="win" type="button">Windows</button><button role="tab" data-os="mac" type="button">Mac</button></div>
<h3>What you need</h3>
<div class="tbl"><table><thead><tr><th>Tool</th><th>Why you need it</th><th>Needed?</th></tr></thead><tbody>
<tr><th>Git</th><td>Makes the save points. The heart of this book.</td><td>Required</td></tr>
<tr><th>A terminal</th><td>Where you type commands. Already on your computer.</td><td>Required</td></tr>
<tr><th>VS Code or Cursor</th><td>Edit code and see Git changes in a side panel. Cursor is VS Code with AI built in.</td><td>Required</td></tr>
<tr><th>GitHub account</th><td>Your cloud backup, sharing and deployments.</td><td>Required</td></tr>
<tr><th>GitHub CLI (<code>gh</code>)</th><td>Log in and create repos from the terminal, with no passwords or SSH keys.</td><td>Strongly recommended</td></tr>
<tr><th>Node.js (LTS version)</th><td>Runs most web apps that AI tools generate: <code>npm install</code>, <code>npm run dev</code>.</td><td>For JavaScript projects</td></tr>
<tr><th>An AI coding tool</th><td>Claude Code, Cursor, or a builder like Lovable that syncs to GitHub.</td><td>Your choice</td></tr></tbody></table></div>
<div class="note"><b>About 25 minutes, once.</b> You need an internet connection and permission to install software. On an office laptop, ask IT if installs are blocked.</div>

<div data-os="win">
<h3>Windows · Step 1: Open a terminal</h3>
<p>Use <b>Windows Terminal</b>: press the Windows key, type <i>Terminal</i>, press Enter. It opens PowerShell, which is fine for every command here. It comes with Windows 11; on Windows 10, install "Windows Terminal" from the Microsoft Store.</p>
<p>Later you can also use the terminal inside VS Code or Cursor: menu <b>Terminal → New Terminal</b>, or Ctrl + &#96; (the key above Tab).</p>
<h3>Windows · Step 2: Install the tools with winget</h3>
<p>winget is the app installer built into Windows 10 and 11. Paste these lines one at a time and accept any prompts:</p>
<pre>winget install --id Git.Git -e --source winget
winget install --id GitHub.cli -e
winget install --id OpenJS.NodeJS.LTS -e
winget install --id Microsoft.VisualStudioCode -e</pre>
<div class="note warn"><b>Close the terminal and open a new one</b> after installing. New tools are only found by terminals opened after the install. This fixes most "not recognized" errors.</div>
<p>Prefer Cursor? Download it from cursor.com instead of VS Code. If winget is missing, update "App Installer" from the Microsoft Store.</p>
<h3>Windows · Or: the Git installer by hand</h3>
<p>If you download Git from git-scm.com instead, the installer asks many questions. Keep the defaults except these:</p>
<div class="tbl"><table><thead><tr><th>Installer screen</th><th>Choose</th></tr></thead><tbody>
<tr><td>Default editor used by Git</td><td>Use Visual Studio Code</td></tr>
<tr><td>Name of the initial branch</td><td>Override, and type <code>main</code></td></tr>
<tr><td>Adjusting your PATH</td><td>Git from the command line and also from 3rd-party software</td></tr>
<tr><td>Line ending conversions</td><td>Checkout Windows-style, commit Unix-style line endings</td></tr>
<tr><td>Credential helper</td><td>Git Credential Manager</td></tr></tbody></table></div>
<p>Installer screens change between versions; if one looks different, the default is fine.</p>
<h3>Windows · Step 3: Three Windows settings</h3>
<p><b>Show hidden files and extensions.</b> Files like <code>.gitignore</code> and <code>.env</code> are hidden by default. In File Explorer open <b>View → Show</b> and tick <b>File name extensions</b> and <b>Hidden items</b> (Windows 10: the View tab on the ribbon).</p>
<p><b>Allow npm scripts in PowerShell.</b> If npm ever says <i>running scripts is disabled on this system</i>, run this once:</p>
<pre>Set-ExecutionPolicy -Scope CurrentUser RemoteSigned</pre>
<p><b>Long paths and line endings.</b> Web projects have deep folders, and Windows and Mac end lines differently. Tell Git once:</p>
<pre>git config --global core.longpaths true
git config --global core.autocrlf true</pre>
</div>

<div data-os="mac">
<h3>Mac · Step 1: Open Terminal</h3>
<p>Press Cmd + Space, type <i>Terminal</i>, press Enter. The Mac shell is zsh, and every command in this book works in it. Later you can use the terminal inside VS Code or Cursor: <b>Terminal → New Terminal</b>.</p>
<h3>Mac · Step 2: Install Apple's Command Line Tools</h3>
<p>These include Git and the compilers many tools need:</p>
<pre>xcode-select --install</pre>
<p>A window pops up; click Install and wait. If it says the tools are already installed, move on.</p>
<h3>Mac · Step 3: Install Homebrew</h3>
<p>Homebrew is the Mac's app installer for developer tools. Paste this single line (it asks for your Mac password, which does not show as you type):</p>
<pre>/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"</pre>
<div class="note warn"><b>Read the "Next steps" at the end.</b> On Apple Silicon Macs (M1, M2, M3, M4) Homebrew prints two or three lines to add it to your PATH. Copy and run them exactly, then open a new Terminal window.</div>
<h3>Mac · Step 4: Install the tools</h3>
<pre>brew install git gh node
brew install --cask visual-studio-code</pre>
<p>Prefer Cursor? <code>brew install --cask cursor</code>, or download it from cursor.com.</p>
<p>To open folders from the terminal with <code>code .</code>, open VS Code, press Cmd + Shift + P, and run <b>Shell Command: Install 'code' command in PATH</b>.</p>
<h3>Mac · Step 5: Two Mac settings</h3>
<p><b>Show hidden files.</b> In Finder press Cmd + Shift + . (period) to show files like <code>.gitignore</code> and <code>.env</code>. Press it again to hide them.</p>
<p><b>Line endings.</b> Keep files consistent with Windows teammates:</p>
<pre>git config --global core.autocrlf input</pre>
</div>

<h3>Both · Tell Git who you are</h3>
<p>Use the same email as your GitHub account. Chapter 2 explains each line, and its lab lets you practise them.</p>
<pre>git config --global user.name "Your Name"
git config --global user.email "you@example.com"
git config --global init.defaultBranch main
git config --global pull.rebase false
git config --global core.editor "code --wait"</pre>
<p>The last line makes Git open VS Code when it needs you to write something, instead of a confusing terminal editor. For Cursor use <code>"cursor --wait"</code>.</p>
<h3>Both · GitHub account and login</h3>
<ol><li>Sign up at github.com with a professional username.</li><li>Turn on two-factor authentication: Settings → Password and authentication.</li><li>Log in from the terminal and follow the prompts: GitHub.com, HTTPS, login with a web browser.</li></ol>
<pre>gh auth login</pre>
<h3>Both · Check that everything works</h3>
<p>Run each line. Every one should print a version number or "Logged in", not an error.</p>
<pre>git --version
gh --version
node -v
npm -v
code --version
gh auth status</pre>
<h3>If something goes wrong</h3>
<div class="tbl"><table><thead><tr><th>You see</th><th>Fix</th></tr></thead><tbody>
<tr><td><i>'git' is not recognized</i> (Windows) or <i>command not found</i></td><td>Close and reopen the terminal. Still failing on Windows: reinstall Git and pick the PATH option shown above.</td></tr>
<tr><td><i>running scripts is disabled on this system</i> (Windows)</td><td>Run <code>Set-ExecutionPolicy -Scope CurrentUser RemoteSigned</code> once.</td></tr>
<tr><td><i>xcrun: error: invalid active developer path</i> (Mac, often after a macOS update)</td><td>Run <code>xcode-select --install</code> again.</td></tr>
<tr><td><i>brew: command not found</i> right after installing Homebrew (Mac)</td><td>You skipped the "Next steps" lines. Scroll up in Terminal, run them, open a new window.</td></tr>
<tr><td><i>code: command not found</i></td><td>Mac: run the "Install 'code' command" step above. Windows: reopen the terminal; the VS Code installer adds it.</td></tr>
<tr><td>Git asks for a GitHub password, and your password fails</td><td>GitHub no longer accepts passwords from Git. Run <code>gh auth login</code> and choose HTTPS.</td></tr>
<tr><td>A file name like <i>.env.txt</i> appears</td><td>Windows hid the extension. Turn on File name extensions, then rename the file to <code>.env</code>.</td></tr></tbody></table></div>`,

{id:'ch1',n:1,title:'Why Vibe Coders Need Git',mins:6,blurb:'Save points, Git vs GitHub, and the four places your code lives.',
lead:'Git saves snapshots of your project, so a bad AI edit never costs you more than one prompt.',
lesson:`
<p>When the AI writes your code, one prompt can break a page that worked five minutes ago. Without Git there is no way back. With Git, every working version is saved and you can return to it in seconds.</p>
<h3>Save points</h3>
<p>Think of a video game. Before a hard level you save. If you lose, you load the save and try again. Git works the same way:</p>
<ul><li>Before a big AI prompt, you <b>commit</b> (save).</li><li>If the AI breaks things, you <b>restore</b> (load the save).</li><li>If it works, you commit again and move on.</li></ul>
<h3>Git and GitHub are different things</h3>
<div class="tbl"><table><thead><tr><th></th><th>Git</th><th>GitHub</th></tr></thead><tbody>
<tr><th>What it is</th><td>A tool on your computer</td><td>A website in the cloud</td></tr>
<tr><th>Its job</th><td>Records save points of your project</td><td>Stores them online, shares them, deploys them</td></tr>
<tr><th>Works offline</th><td>Yes</td><td>No</td></tr>
<tr><th>Think of it as</th><td>Your phone camera</td><td>Google Photos</td></tr></tbody></table></div>
<h3>Six words you must know</h3>
<div class="tbl"><table><thead><tr><th>Word</th><th>Meaning</th><th>Like</th></tr></thead><tbody>
<tr><th>Repository (repo)</th><td>A project folder that Git tracks</td><td>A photo album</td></tr>
<tr><th>Commit</th><td>One saved snapshot, with a message</td><td>One photo with a caption</td></tr>
<tr><th>Staging</th><td>Picking which changes go into the next commit</td><td>Choosing photos before printing</td></tr>
<tr><th>Branch</th><td>A parallel copy for experiments</td><td>A rough-work notebook</td></tr>
<tr><th>Push</th><td>Upload your commits to GitHub</td><td>Upload to Google Photos</td></tr>
<tr><th>Pull</th><td>Download new commits from GitHub</td><td>Sync from Google Photos</td></tr></tbody></table></div>
<h3>The four places your code lives</h3>
<div class="flow" role="img" aria-label="Working folder, then git add to the staging area, then git commit to the local repo, then git push to GitHub">
<div class="fbox"><b>Working folder</b><span>Files you and the AI edit right now</span></div><div class="farrow"><code>git add</code></div>
<div class="fbox"><b>Staging area</b><span>Changes picked for the next save</span></div><div class="farrow"><code>git commit</code></div>
<div class="fbox"><b>Local repo</b><span>Your save points, on your computer</span></div><div class="farrow"><code>git push</code></div>
<div class="fbox hot"><b>GitHub</b><span>Save points in the cloud (backup)</span></div></div>
<p>Code moves right with <code>git add</code>, <code>git commit</code> and <code>git push</code>. It comes back left with <code>git restore</code> (undo) and <code>git pull</code> (download). Learn this picture once and every command in this book makes sense.</p>`,

{id:'ch2',n:2,title:'Setting Up Git and GitHub',mins:6,blurb:'Install, tell Git who you are, and log in to GitHub once.',
lead:'Setup takes about 15 minutes on a real computer, and you do it once.',
lesson:`
<h3>Install Git</h3>
<p>The full step-by-step for Windows and Mac, with every setting, is in <a href="#setup">Chapter 0</a>. The short version:</p>
<ul><li><b>Windows:</b> download from git-scm.com and install with the defaults. You also get Git Bash, a terminal that understands every command in this book.</li>
<li><b>Mac:</b> open Terminal and type <code>git --version</code>. If Git is missing, macOS offers to install it.</li>
<li><b>Linux:</b> <code>sudo apt install git</code></li></ul>
<h3>Tell Git who you are</h3>
<p>Every commit is stamped with a name and email. Use the same email as your GitHub account so GitHub links commits to your profile.</p>
<pre>git config --global user.name "Your Name"
git config --global user.email "you@example.com"
git config --global init.defaultBranch main
git config --global pull.rebase false</pre>
<p>The third line makes new projects start on a branch called <code>main</code>. The fourth tells <code>git pull</code> to merge, which saves you from a confusing "divergent branches" error later.</p>
<h3>Create a GitHub account</h3>
<p>Sign up at github.com with a professional username, since clients may see it. Turn on two-factor authentication in Settings, under Password and authentication.</p>
<h3>Install the GitHub CLI and log in</h3>
<p>The GitHub CLI (<code>gh</code>) creates repos and logs you in from the terminal, so you never fight with passwords or SSH keys.</p>
<ul><li><b>Windows:</b> <code>winget install --id GitHub.cli</code></li><li><b>Mac:</b> <code>brew install gh</code></li></ul>
<pre>gh auth login     # choose GitHub.com, HTTPS, login with a web browser
gh auth status    # should say: Logged in to github.com</pre>
<div class="note"><b>Visual helper.</b> VS Code and Cursor have a Source Control panel (the branch icon on the left) that shows changed files and commits with clicks. Learn the commands first, then use whichever feels faster.</div>`,

 {q:'Which command shows whether the GitHub CLI is logged in?',o:['git status','gh auth status','git config --list','gh whoami --check'],a:1,why:'gh auth status prints the account you are logged in as.'},
 {q:'What does git config --global pull.rebase false do?',o:['Turns off git pull','Makes git pull merge remote changes in, avoiding the "divergent branches" error','Deletes old branches','Disconnects GitHub'],a:1,why:'Newer Git asks how to combine diverged work. This setting answers "merge" once, for good.'}]},

{id:'ch3',n:3,title:'Your First Repository',mins:7,blurb:'git init, .gitignore, the first commit, pushing to GitHub, cloning.',
lead:'Two ways to start: turn a folder into a repo, or download one that already exists on GitHub.',
lesson:`
<h3>Start a new project</h3>
<p>Inside your project folder run <code>git init</code>. It creates a hidden <code>.git</code> folder, the database of all your save points. Never delete it.</p>
<p>Before the first commit, create a <code>.gitignore</code> so junk like <code>node_modules</code> (thousands of library files you can reinstall any time) never gets saved:</p>
<pre>git init
echo "node_modules/" > .gitignore
git add .
git commit -m "Initial commit"</pre>
<h3>Put it on GitHub</h3>
<p>One command creates the GitHub repo, links it and uploads your code:</p>
<pre>gh repo create shop --private --source=. --push</pre>
<div class="tbl"><table><tbody>
<tr><th><code>shop</code></th><td>The repo name on GitHub</td></tr>
<tr><th><code>--private</code></th><td>Only you can see it. Always start private.</td></tr>
<tr><th><code>--source=.</code></th><td>Use this folder</td></tr>
<tr><th><code>--push</code></th><td>Upload your commits right away</td></tr></tbody></table></div>
<h3>The manual way</h3>
<p>If you create an empty repo on github.com instead, it shows you these commands. <code>origin</code> is the nickname for your GitHub copy, and <code>-u</code> remembers it so later a plain <code>git push</code> is enough.</p>
<pre>git remote add origin https://github.com/you/shop.git
git branch -M main
git push -u origin main</pre>
<h3>Download an existing project</h3>
<p>To work on a project that already lives on GitHub, such as one exported from Lovable, clone it. You get the code and its full history, already linked to GitHub.</p>
<pre>git clone https://github.com/you/shop.git
git remote -v     # shows where this repo pushes to</pre>`,
lab:{intro:'You have a shop app with a node_modules folder and nothing tracked. Make it a repo, keep the junk out, and get it onto GitHub.',setup:()=>base({extra:{'node_modules/react.js':'// thousands of lines of library code'}}),missions:[
 {t:'Turn the folder into a Git repository.',hint:['git init'],check:S=>!!S.repo},
 {t:'Ask Git what it sees.',hint:['git status'],check:S=>!!S.repo&&E(S,'status')},
 {t:'Create a .gitignore so node_modules is never saved.',hint:['echo "node_modules/" > .gitignore'],check:S=>ignored(S,'node_modules/react.js')},
 {t:'Stage your files. node_modules should stay out.',hint:['git add .','git status'],check:S=>!!S.repo&&S.repo.index['index.html']!==undefined&&S.repo.index['.gitignore']!==undefined&&S.repo.index['node_modules/react.js']===undefined},
 {t:'Make your first commit.',hint:['git commit -m "Initial commit"'],check:S=>!!headId(S)},
 {t:'Create a private GitHub repo and push to it.',hint:['gh repo create shop --private --source=. --push'],check:S=>synced(S)},
 {t:'Check where your repo pushes to.',hint:['git remote -v'],check:S=>synced(S)&&E(S,'remoteV')},
 {t:'Pretend you have a new laptop: clone the repo.',hint:['git clone https://github.com/you/shop.git'],note:'Look at the Files tab afterwards: node_modules is gone, because it was never on GitHub.',check:S=>E(S,'clone')}]},
quiz:[
 {q:'What does the hidden .git folder contain?',o:['Your .gitignore rules','All your history and save points','Your node_modules','Your GitHub password'],a:1,why:'Delete .git and the project loses every save point.'},
 {q:'Why put node_modules/ in .gitignore?',o:['It is huge and npm install recreates it','It contains passwords','Git cannot read JavaScript','GitHub blocks folders'],a:0,why:'Libraries are downloaded again from package.json. Saving them bloats the repo.'},
 {q:'You get a new laptop. Which command gets your project back?',o:['git init','git pull','git clone <url>','gh auth login'],a:2,why:'git clone downloads the code and full history and links it to GitHub.'}]},

{id:'ch4',n:4,title:'The Daily Loop',mins:6,blurb:'status, add, commit, push, and the commit-before-every-prompt habit.',
lead:'Four commands cover most of your Git life: status, add, commit, push.',
lesson:`
<pre>git status                       # 1. What changed?
git add .                        # 2. Stage all changes
git commit -m "Add login page"   # 3. Save a snapshot
git push                         # 4. Upload to GitHub</pre>
<div class="tbl"><table><thead><tr><th>Command</th><th>What it does</th><th>When</th></tr></thead><tbody>
<tr><td><code>git status</code></td><td>Lists changed, new and deleted files</td><td>Any time you are unsure. It never changes anything.</td></tr>
<tr><td><code>git add .</code></td><td>Stages every change</td><td>Before each commit</td></tr>
<tr><td><code>git add app.js</code></td><td>Stages one file only</td><td>When you want to commit part of your work</td></tr>
<tr><td><code>git commit -m "…"</code></td><td>Saves staged changes as a snapshot</td><td>When something works</td></tr>
<tr><td><code>git push</code></td><td>Sends commits to GitHub</td><td>At least daily, or after each feature</td></tr></tbody></table></div>
<h3>The golden habit</h3>
<p><b>Commit before every big AI prompt. Commit again after every change that works.</b> This one habit removes almost all the fear from vibe coding.</p>
<div class="loop" role="img" aria-label="Commit, ask the AI, test. If it works, commit again. If it broke, git restore and try another prompt."><span class="hot">Commit</span><i>→</i><span>Ask the AI</span><i>→</i><span>Test the app</span><i>→</i><span>Works? Commit again</span><i>·</i><span>Broke? <code>git restore .</code></span></div>
<h3>How often to commit</h3>
<p>Every time you reach a state you would be sad to lose. For vibe coders that is often every 10 to 30 minutes. Small commits are easy to undo; one giant commit at the end of the day is almost useless as a save point.</p>
<h3>Reading git status</h3>
<ul><li><b>Red files:</b> changed but not staged yet.</li><li><b>Green files:</b> staged, ready to commit.</li><li><b>Untracked files:</b> new files Git has never seen.</li><li><b>"nothing to commit, working tree clean":</b> everything is saved. A good moment for the next prompt.</li><li><b>"ahead of 'origin/main' by 3 commits":</b> you have commits not on GitHub yet. Run <code>git push</code>.</li></ul>`,
lab:{intro:'The shop is already on GitHub. Build features with the AI using the loop, one commit per working change.',setup:()=>seed(base(),START),missions:[
 {t:'Ask the AI for a feature.',hint:['ai "add a product list"'],check:S=>E(S,'ai')},
 {t:'Test the app.',hint:['test'],check:S=>E(S,'testPass')},
 {t:'See what the AI changed.',hint:['git status','git diff'],check:S=>E(S,'ai')&&last(S,/^git (status|diff)/)>first(S,/^ai\s/)},
 {t:'Save it as a commit.',hint:['git add .','git commit -m "Add product list"'],check:S=>commitCount(S)>=2},
 {t:'Do the loop twice more: 4 commits in total.',hint:['ai "add a contact form" && test && git add . && git commit -m "Add contact form"'],check:S=>commitCount(S)>=4},
 {t:'Push your commits to GitHub.',hint:['git push'],check:S=>commitCount(S)>=4&&synced(S)},
 {t:'Finish with a clean working tree.',hint:['git status'],check:S=>commitCount(S)>=4&&synced(S)&&isClean(S)}]},
quiz:[
 {q:'When should you commit in the vibe coding loop?',o:['Once a day','Before every big prompt and after every change that works','Only right before pushing','When the AI finishes the whole app'],a:1,why:'Commits are save points. You want one right before the AI touches things.'},
 {q:'git status says "ahead of \'origin/main\' by 2 commits". What do you do?',o:['git pull','git push','git commit','Nothing'],a:1,why:'You have 2 commits GitHub does not have yet. Push them.'},
 {q:'Files in red under "Changes not staged for commit" are…',o:['Saved','Changed but not staged yet','Deleted for good','Already on GitHub'],a:1,why:'Red means changed in your folder but not added with git add.'}]},

{id:'ch5',n:5,title:'Rescue Commands When AI Breaks Things',mins:9,blurb:'diff, restore, clean, reset, revert, reflog and stash.',
lead:'If you committed before the AI made its change, you can always get back.',
lesson:`
<h3>Look before you undo</h3>
<pre>git diff              # changes not staged yet
git diff --staged     # changes already staged
git diff --stat       # just the files and line counts</pre>
<p>Often the AI got 90% right and broke one file. Then you only undo that file.</p>
<h3>Undo changes you have not committed</h3>
<pre>git restore app.js    # undo one file
git restore .         # undo every tracked file
git clean -n          # preview new junk files the AI created
git clean -fd         # delete them for good</pre>
<div class="note warn"><b>Always run git clean -n first.</b> Files removed by git clean do not go to the Recycle Bin.</div>
<p>Staged something by mistake? <code>git restore --staged .</code> unstages it and keeps the change in your files.</p>
<h3>History and commit IDs</h3>
<p><code>git log --oneline</code> lists commits. The 7-character code at the start of each line, like <code>a1b2c3d</code>, is the commit ID you use to travel in time.</p>
<h3>Undo commits</h3>
<div class="tbl"><table><thead><tr><th>Situation</th><th>Command</th><th>Safe?</th></tr></thead><tbody>
<tr><td>Undo the last commit, keep the changes</td><td><code>git reset --soft HEAD~1</code></td><td>Yes</td></tr>
<tr><td>Undo a commit already on GitHub</td><td><code>git revert &lt;id&gt;</code></td><td>Yes, safest for pushed work</td></tr>
<tr><td>Fix the last commit message (not pushed)</td><td><code>git commit --amend -m "…"</code></td><td>Yes</td></tr>
<tr><td>Throw away everything after a commit</td><td><code>git reset --hard &lt;id&gt;</code></td><td>Dangerous: later work is gone</td></tr>
<tr><td>Bring back one old file</td><td><code>git restore --source=&lt;id&gt; index.html</code></td><td>Yes</td></tr></tbody></table></div>
<h3>The safety net: reflog</h3>
<p>Even after a bad <code>git reset --hard</code>, Git keeps a lost commit findable for at least 30 days (90 days for commits still on a branch). <code>git reflog</code> lists every position; find the line from before the mistake and run <code>git reset --hard &lt;id&gt;</code> with its ID. Commits are very hard to lose. Uncommitted work is easy to lose, which is why you commit often.</p>
<h3>Park work for a moment</h3>
<pre>git stash         # put changes aside
git stash pop     # bring them back
git stash list    # see what is parked</pre>`,
lab:{intro:'The shop has 3 commits on GitHub. You will break it on purpose and fix it with every rescue command, so you stay calm when it happens for real.',setup:()=>seed(base(),[...START.slice(0,4),'echo "<h1>My Shop</h1>\\n<p>Welcome to my shop!</p>\\n<ul><li>Basmati rice 5 kg: ₹450</li></ul>" > index.html','git commit -am "Add product list"','echo "h1 { color: navy; }\\nul { padding: 0; }" > style.css','git commit -am "Style the product list"',START[4]]),missions:[

 {t:'Undo a commit that is already on GitHub, the safe way.',hint:['git restore --staged . && git restore .','git revert HEAD'],check:S=>msgs(S).some(m=>m.startsWith('Revert'))},
 {t:'Bring back the first version of index.html from history.',hint:['git log --oneline','git restore --source=<first-id> index.html'],note:'Copy the ID of "Initial commit" from git log.',check:S=>E(S,'restoreSource')},

 {t:'Park a half-done change with stash, then bring it back.',hint:['echo "// draft" >> app.js','git stash','git stash pop'],check:S=>E(S,'stash')&&E(S,'stashPop')}]},
quiz:[
 {q:'The AI made a mess and you have not committed. Which command undoes edits to tracked files?',o:['git reset --soft HEAD~1','git restore .','git revert HEAD','git push --force'],a:1,why:'git restore . puts every tracked file back to the last commit. New files need git clean.'},

{id:'ch6',n:6,title:'Branches for Safe Experiments',mins:6,blurb:'Try big changes on a branch; merge if they work, delete if not.',
lead:'A branch lets the AI try something big while main stays working.',
lesson:`
<h3>When to use a branch</h3>
<ul><li>A new feature that touches many files</li><li>A big refactor ("rewrite this in TypeScript", "switch to Supabase")</li><li>Trying two different designs</li><li>Anything you are not sure will work</li></ul>
<p>For small fixes, committing straight on <code>main</code> is fine when you work alone.</p>
<h3>The branch workflow</h3>
<pre>git switch main
git pull
git switch -c feature/payments     # create the branch and move onto it
git add .
git commit -m "Add Razorpay checkout"</pre>
<p><b>It worked:</b></p>
<pre>git switch main
git merge feature/payments
git push
git branch -d feature/payments     # tidy up</pre>
<p><b>It failed:</b></p>
<pre>git switch main
git branch -D feature/payments     # capital D forces the delete</pre>
<p><code>main</code> was never touched, so it still works.</p>
<div class="tbl"><table><thead><tr><th>Command</th><th>What it does</th></tr></thead><tbody>
<tr><td><code>git branch</code></td><td>Lists branches. The one with * is where you are.</td></tr>
<tr><td><code>git switch name</code></td><td>Moves to an existing branch</td></tr>
<tr><td><code>git switch -c name</code></td><td>Creates a branch and moves to it</td></tr>
<tr><td><code>git branch -d name</code></td><td>Deletes a merged branch</td></tr>
<tr><td><code>git branch -D name</code></td><td>Deletes a branch even if it was never merged</td></tr>
<tr><td><code>git push -u origin name</code></td><td>Uploads a branch to GitHub</td></tr></tbody></table></div>
<h3>Two rules</h3>
<p>Name branches with a prefix and no spaces: <code>feature/login</code>, <code>fix/cart-total</code>, <code>experiment/new-ui</code>. And commit or stash before every <code>git switch</code>: <code>git status</code> should say "working tree clean".</p>`,
lab:{intro:'Run one experiment that works and one that fails. Watch the History tab to see the branches split and join.',setup:()=>seed(base(),START),missions:[
 {t:'Create a branch for a cart feature.',hint:['git switch -c feature/cart'],check:S=>E(S,'branch:feature/cart')},
 {t:'Build the feature on the branch and commit it.',hint:['ai "add an add-to-cart button" && git add . && git commit -m "Add cart button"'],check:S=>E(S,'commitOn:feature/cart')},
 {t:'Switch back to main. The cart is gone from the files.',hint:['git switch main','cat index.html'],check:S=>E(S,'commitOn:feature/cart')&&last(S,/^git (switch|checkout) main/)>-1},
 {t:'Merge the branch into main.',hint:['git merge feature/cart'],check:S=>E(S,'merge:feature/cart')},
 {t:'Delete the merged branch.',hint:['git branch -d feature/cart'],check:S=>E(S,'del:feature/cart')},
 {t:'Start a risky experiment on a new branch and commit it.',hint:['git switch -c experiment/redesign','ai "redesign everything" && git add . && git commit -m "Try redesign"'],check:S=>E(S,'commitOn:experiment/redesign')},
 {t:'Throw the failed experiment away. Main must still work.',hint:['git switch main','git branch -D experiment/redesign','test'],check:S=>E(S,'del:experiment/redesign')&&S.repo.head==='main'&&!(S.files['index.html']||'').includes('BROKEN')},
 {t:'Push main to GitHub.',hint:['git push'],check:S=>E(S,'merge:feature/cart')&&synced(S)}]},
quiz:[
 {q:'Which command creates a branch and moves you onto it?',o:['git branch name','git switch -c name','git merge name','git push name'],a:1,why:'git branch only creates it; git switch -c creates it and switches.'},
 {q:'Difference between git branch -d and -D?',o:['-d deletes only merged branches; -D forces the delete','They are the same','-D deletes on GitHub too','-d deletes main'],a:0,why:'-d protects you from deleting unmerged work. -D says "I know, delete it anyway".'},
 {q:'What should git status say before you switch branches?',o:['Your branch is ahead','nothing to commit, working tree clean','Untracked files present','HEAD detached'],a:1,why:'Uncommitted changes either follow you to the other branch or block the switch.'}]},

{id:'ch7',n:7,title:'.gitignore and Protecting Secrets',mins:7,blurb:'Keep .env and API keys off GitHub, and fix it fast if one slips.',
lead:'Never push API keys, passwords or .env files. Bots scan public GitHub repos for leaked keys within minutes.',
lesson:`
<h3>What .gitignore does</h3>
<p><code>.gitignore</code> is a plain text file in your project root listing files Git must never track. Create it <b>before</b> your first commit. A good start for web apps:</p>
<pre># Secrets
.env
.env.*
!.env.example
# Dependencies and build output
node_modules/
dist/
build/
.next/
# System junk
.DS_Store
*.log</pre>
<p><code>!.env.example</code> means "do track this one". Keep an <code>.env.example</code> with the variable <b>names</b> and fake values, so others know which keys the app needs. Tip: ask your AI to "create a .gitignore for this project".</p>
<h3>Where secrets live</h3>
<ul><li><b>On your computer:</b> in <code>.env</code>, which Git ignores.</li><li><b>On your host:</b> in the environment variables of Vercel, Netlify, Render or Supabase.</li><li><b>Never:</b> typed into a .js or .py file. AI tools sometimes paste keys straight into code, so read the diff before every commit.</li></ul>
<h3>Already tracking a file you should ignore?</h3>
<p>Adding a file to .gitignore does not untrack it. Remove it from tracking; the file stays on your disk:</p>
<pre>git rm --cached passwords.txt
echo "passwords.txt" >> .gitignore
git commit -am "Stop tracking passwords.txt"</pre>
<h3>If you pushed a secret</h3>
<ol><li><b>Revoke the key now</b> in the provider dashboard and create a new one. This is the step that protects you.</li><li>Put the new key in <code>.env</code> only.</li><li>Untrack the file and push.</li></ol>
<p>Deleting the file is not enough, because the old key is still in your history. Once revoked, that old copy is harmless.</p>
<div class="note"><b>GitHub push protection</b> blocks pushes that contain known key formats (Stripe, AWS, OpenAI and many more). It is on by default only for <b>public</b> repos; private repos need GitHub's paid Secret Protection. So treat it as a seatbelt, not a plan. If a push is rejected for a "secret", do not bypass it: <code>git reset --soft HEAD~1</code>, take the key out, and commit again.</div>`,
lab:{intro:'This repo has no .gitignore and a passwords.txt that was committed by mistake. Lock it down, then watch push protection block a leaked key. (On a real private repo this needs GitHub\'s paid Secret Protection; the playground shows what it looks like.)',setup:()=>seed(base({extra:{'passwords.txt':'admin: hunter2'}}),['git init','git add .','git commit -m "Initial commit"','gh repo create shop --private --source=. --push']),missions:[
 {t:'Create a .env file with a (fake) API key.',hint:['echo "STRIPE_KEY=sk_test_12345" > .env'],check:S=>S.files['.env']!==undefined},
 {t:'Run git status and spot .env as an untracked file.',hint:['git status'],check:S=>S.files['.env']!==undefined&&last(S,/^git status/)>first(S,/\.env/)},
 {t:'Make Git ignore .env.',hint:['echo ".env" >> .gitignore','git status'],check:S=>ignored(S,'.env')},
 {t:'Stop tracking passwords.txt (keep it on disk) and ignore it.',hint:['git rm --cached passwords.txt','echo "passwords.txt" >> .gitignore'],check:S=>S.repo.index['passwords.txt']===undefined&&S.files['passwords.txt']!==undefined&&ignored(S,'passwords.txt')},
 {t:'Commit and push the cleanup.',hint:['git add . && git commit -m "Stop tracking secrets" && git push'],check:S=>synced(S)&&headTree(S)['.gitignore']!==undefined&&headTree(S)['passwords.txt']===undefined&&headTree(S)['.env']===undefined},
 {t:'Let the AI paste a key into code, commit, and try to push.',hint:['ai "add the payment api key"','git commit -am "Add payments" && git push'],check:S=>E(S,'pushBlocked')},
 {t:'Undo that commit, remove the key, and get back in sync.',hint:['git reset --soft HEAD~1','git restore --staged app.js && git restore app.js','git push'],check:S=>E(S,'pushBlocked')&&synced(S)&&!/sk_live_/.test(S.files['app.js']||'')}]},
quiz:[
 {q:'You pushed a real API key yesterday. What is the first thing to do?',o:['Delete the file and push','Revoke the key and create a new one','Make the repo private','Add it to .gitignore'],a:1,why:'Bots may already have it. Only revoking makes the leaked key useless.'},
 {q:'Why is deleting the file not enough?',o:['GitHub keeps a backup','The key is still in your Git history','Git cannot delete files','It is inside node_modules'],a:1,why:'Every old commit still contains the key.'},
 {q:'You added .env to .gitignore but Git still tracks it. Why?',o:['Ignore rules do not apply to files Git already tracks','Git needs a restart','The pattern is wrong','.gitignore only works on GitHub'],a:0,why:'Run git rm --cached .env to stop tracking it.'},
 {q:'Where do keys go for an app deployed on Vercel?',o:['In app.js','In the README','In Vercel environment variables','In .gitignore'],a:2,why:'The host injects them at runtime, so they never touch your repo.'}]},

{id:'ch8',n:8,title:'GitHub Essentials',mins:7,blurb:'Private repos, README, issues, pull requests and auto-deploys.',
lead:'Five GitHub features matter most for vibe coders: private repos, the README, issues, pull requests and auto-deploys.',
lesson:`
<h3>Public or private</h3>
<p><b>Private</b> for client work, business tools and anything with business logic. <b>Public</b> for portfolio projects and tutorials. You can change it later in Settings, but check the whole history for secrets before going public.</p>
<h3>README.md</h3>
<p>GitHub shows it on the repo's front page. It should answer: what the app does, how to run it (<code>npm install</code>, <code>npm run dev</code>), which environment variables it needs, and where it is deployed. Ask your AI to draft it, then make it accurate.</p>
<h3>Issues: your to-do list</h3>
<pre>gh issue create --title "Cart total wrong with discount"
gh issue list</pre>
<p>Write <code>Fixes #12</code> in the pull request description, or in a commit message that lands on main, and GitHub closes issue 12 automatically when it merges.</p>
<h3>Pull requests</h3>
<p>A pull request (PR) proposes merging a branch into main and shows every changed line. Solo vibe coders should use them too: the PR page is the easiest way to <b>review what the AI changed</b> before it reaches main.</p>
<pre>git switch -c feature/dashboard
git push -u origin feature/dashboard
gh pr create --fill
gh pr view --web                        # read the Files changed tab
gh pr merge --squash --delete-branch
git switch main
git pull</pre>
<p><code>--squash</code> turns all the branch's commits into one tidy commit on main.</p>
<h3>Auto-deploy and AI builders</h3>
<p>Connect the repo to Vercel, Netlify or Render once, and every push to main deploys automatically; every PR gets its own preview link. Lovable and Bolt can sync to GitHub too. Turn it on early: you get a history of every AI edit, a backup you own, and the option to open the code in Cursor or Claude Code. When both push to the same repo, always <code>git pull</code> first.</p>`,

{id:'ch9',n:9,title:'Syncing and Merge Conflicts',mins:7,blurb:'Pull before you work, and fix conflicts without panic.',
lead:'Run git pull before you start work and most conflicts never happen.',
lesson:`
<h3>Why you pull</h3>
<p>Your GitHub repo can change without you: a teammate pushes, Lovable syncs an edit, or you pushed from your laptop and are now on another PC. <code>git pull</code> downloads those commits and merges them in.</p>
<p>If you push while GitHub has commits you don't, Git rejects it with "Updates were rejected". The fix is always: <code>git pull</code>, then <code>git push</code>.</p>
<h3>What a conflict looks like</h3>
<p>A conflict happens when the same lines changed in two places. Git cannot guess which is right, so it writes both into the file:</p>
<pre>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD
&lt;h1&gt;Best Deals in Delhi&lt;/h1&gt;
=======
&lt;h1&gt;Welcome to My Shop Online&lt;/h1&gt;
&gt;&gt;&gt;&gt;&gt;&gt;&gt; origin/main</pre>
<p>Between <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</code> and <code>=======</code> is <b>your</b> version. Between <code>=======</code> and <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code> is the <b>incoming</b> one.</p>
<h3>Resolve it in four steps</h3>
<ol><li><code>git status</code> lists files under "both modified".</li><li>Open each file. VS Code and Cursor show Accept Current, Accept Incoming and Accept Both buttons.</li><li>Keep the right lines and delete every marker line.</li><li>Save, then <code>git add .</code>, <code>git commit</code>, <code>git push</code>.</li></ol>
<p><b>Shortcut:</b> paste the file into your AI and say "Resolve this merge conflict, keep the new heading." Then check that it runs. <b>Panic button:</b> <code>git merge --abort</code> cancels the merge and puts everything back.</p>
<h3>Avoiding conflicts</h3>
<ul><li>Pull every time you sit down to work.</li><li>Push small commits often.</li><li>Don't edit the same file in Lovable and locally at the same time.</li><li>Merge branches soon; old branches drift and conflict more.</li></ul>`,

{id:'ch10',n:10,title:'Working With AI Coding Tools',mins:6,blurb:'Let the AI run Git while you stay in control of what gets saved.',
lead:'AI tools can run Git for you, but you decide what gets saved and shipped.',
lesson:`
<h3>Let the AI run Git, with you watching</h3>
<p>Claude Code, Cursor and similar agents can run Git. Useful prompts:</p>
<ul><li>"Commit the current working state with a clear message."</li><li>"Show me what changed since the last commit and explain it."</li><li>"Create a branch called feature/invoices before you start."</li><li>"Resolve the merge conflict in App.jsx, keeping both changes."</li><li>"Undo your last change and go back to the last commit."</li></ul>
<div class="note warn"><b>You approve anything destructive.</b> Never let an agent run <code>git reset --hard</code>, <code>git clean -fd</code>, <code>git push --force</code> or delete branches without reading the command first.</div>
<h3>One feature per session, one branch per feature</h3>
<p>AI sessions drift: the longer they run, the more files they touch. Commit or start a branch, give one clear task, test, commit, then start a fresh session for the next task.</p>
<h3>Review every AI diff</h3>
<p>AI tools sometimes delete code they think is unused, rewrite files you didn't mention, paste keys into code, or leave debug lines behind. Run <code>git diff --stat</code> to see which files changed. If one appears that shouldn't, <code>git restore</code> it before committing.</p>
<h3>Commits are context for the AI</h3>
<p>Clear commit messages let you ask "look at the last 5 commits and tell me where the cart bug started"; the AI reads <code>git log</code> and <code>git diff</code> to find out.</p>
<h3>A typical day</h3>
<pre>git pull                              # morning: sync
git switch -c feature/reports         # one goal for the session
git add . && git commit -m "feat: add reports"   # after each working step
git push -u origin feature/reports
gh pr create --fill                   # review the diff
gh pr merge --squash --delete-branch  # merge, auto-deploy
git switch main && git pull           # back to a clean main</pre>
<p><b>Advanced:</b> running two agents at once? Give each its own folder with <code>git worktree add ../app-payments -b feature/payments</code> so they don't overwrite each other.</p>`,

{id:'ch11',n:11,title:'Golden Rules and Commit Messages',mins:5,blurb:'Ten rules that keep projects safe, and messages that make sense later.',
lead:'Ten rules keep your projects safe. Follow them and Git will rarely surprise you.',
lesson:`
<h3>The ten golden rules</h3>
<ol><li><b>Commit before every big AI prompt.</b> It is your save point.</li><li><b>Commit after every change that works.</b> Small and often beats big and rare.</li><li><b>Read the diff before committing.</b> AI sneaks in unwanted changes.</li><li><b>Never commit secrets.</b> .gitignore first, .env always ignored.</li><li><b>Keep main working.</b> It is what deploys.</li><li><b>Experiment on branches.</b> Delete them freely when they fail.</li><li><b>Pull before you start.</b> It prevents most conflicts.</li><li><b>Push at least daily.</b> Laptops die; GitHub is your backup.</li><li><b>Never force-push to main.</b> It overwrites history on GitHub.</li><li><b>Start private.</b> Go public only after checking for secrets.</li></ol>
<h3>Good commit messages</h3>
<p>Write what changed, as an instruction: "Add", "Fix", "Remove", not "Added" or "Fixing".</p>
<div class="tbl"><table><thead><tr><th>Bad</th><th>Good</th></tr></thead><tbody>
<tr><td>update</td><td>Add GST calculation to invoice page</td></tr><tr><td>fix</td><td>Fix cart total when discount is 100%</td></tr><tr><td>changes</td><td>Move Supabase keys to environment variables</td></tr><tr><td>final final v2</td><td>Redesign dashboard header for mobile</td></tr></tbody></table></div>
<h3>Conventional commits</h3>
<div class="tbl"><table><thead><tr><th>Prefix</th><th>Use for</th><th>Example</th></tr></thead><tbody>
<tr><td><code>feat:</code></td><td>A new feature</td><td>feat: add WhatsApp share button</td></tr>
<tr><td><code>fix:</code></td><td>A bug fix</td><td>fix: wrong date format in reports</td></tr>
<tr><td><code>refactor:</code></td><td>Cleanup, same behaviour</td><td>refactor: split App.jsx into components</td></tr>
<tr><td><code>docs:</code></td><td>README or comments</td><td>docs: add setup steps</td></tr>
<tr><td><code>chore:</code></td><td>Config, dependencies</td><td>chore: update packages</td></tr></tbody></table></div>
<p>Typo in the last message and not pushed yet? <code>git commit --amend -m "better message"</code> rewrites it. Tip: ask the AI to "write a conventional commit message for these changes".</p>`,
